    <!-- Divisor Vertical -->
    <div class="hidden sm:block h-8 w-px bg-white/20"></div>

    <!-- Identidad del Sistema ESD Control + Firma Quality Solutions -->
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1 class="font-black text-lg tracking-tight leading-none text-white">ESD Control</h1>
        <span class="text-[9px] bg-white/15 px-2 py-0.5 rounded-md font-bold text-white/90 border border-white/15">V1.0</span>
        <span v-if="userRoleName" class="text-[9px] bg-[#d1f0d5] text-[#043e49] px-2.5 py-0.5 rounded-full font-black uppercase tracking-wider border border-[#a3e2ac] shadow-sm">
          {{ translateRole(userRoleName) }}
        </span>
      </div>
      <p class="text-[9px] text-emerald-200 font-bold uppercase tracking-widest mt-1 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#4ade80]"></span>
        <span>{{ $t('header.developedBy') }}</span>
      </p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <!-- Botón de Sincronización Forzada con Google Sheets -->
    <button 
      @click="triggerManualSync" 
      :disabled="syncing"
      class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all duration-200 border border-white/15 shadow-sm disabled:opacity-50"
      :title="$t('header.sync_title')">
      <i class="fas fa-sync-alt text-xs" :class="{'fa-spin text-yellow-300': syncing}"></i>
      <span class="hidden sm:inline text-[11px] font-extrabold">{{ syncing ? $t('header.syncing') : $t('header.sync_btn') }}</span>
    </button>

    <!-- Selector de Idiomas (4 Idiomas: ES, EN, ZH, TH) -->
    <div class="relative mr-1">
      <button 
        @click="showLangDropdown = !showLangDropdown" 
        class="flex items-center gap-2 bg-white/10 hover:bg-white/20 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all duration-200 border border-white/15 shadow-sm"
        :title="$t('header.lang_title')">
        <span class="text-sm leading-none">{{ currentLanguage.flag }}</span>
        <span class="font-extrabold text-[11px] tracking-wide">{{ currentLanguage.name }}</span>
        <i class="fas fa-chevron-down text-[9px] opacity-75 ml-1 transition-transform duration-200" :class="{'rotate-180': showLangDropdown}"></i>
      </button>

      <!-- Menú Desplegable Flotante -->
      <div 
        v-if="showLangDropdown" 
        class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-2xl py-2 z-50 border border-slate-200 animate-fade">
        <div class="px-3.5 py-1 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 mb-1">
          <i class="fas fa-globe mr-1 text-[#043e49]"></i> {{ $t('header.lang_title') }}
        </div>
        <button 
          v-for="lang in availableLanguages" 
          :key="lang.code" 
          @click="setLanguage(lang.code)" 
          class="w-full text-left px-3.5 py-2 text-xs font-bold flex items-center justify-between hover:bg-slate-50 transition-colors"
          :class="locale === lang.code ? 'text-[#043e49] bg-[#d1f0d5]/40 font-black' : 'text-slate-700'">
          <span class="flex items-center gap-2.5">
            <span class="text-base leading-none">{{ lang.flag }}</span>
            <span>{{ lang.name }}</span>
          </span>
          <i v-if="locale === lang.code" class="fas fa-check text-[#bd1a31] text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Navegación Dashboard / Configuración -->
    <button @click="view='dashboard'" :class="view==='dashboard'?'bg-[#bd1a31] text-white shadow-lg border border-white/20':'text-white/80 hover:bg-white/10 hover:text-white'" class="px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
      <i class="fas fa-chart-pie"></i> {{ $t('header.btn_dashboard') }}
    </button>
    <button v-if="userPermissions.canConfig || userPermissions.canUsers" @click="view='admin'" :class="view==='admin'?'bg-[#bd1a31] text-white shadow-lg border border-white/20':'text-white/80 hover:bg-white/10 hover:text-white'" class="px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
      <i class="fas fa-cogs"></i> {{ $t('header.btn_config') }}
    </button>
  </div>
</header>
