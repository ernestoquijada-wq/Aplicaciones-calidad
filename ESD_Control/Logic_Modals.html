<script>
/**
 * 🟢 COMPOSABLE: LÓGICA DE MODALES GLOBALES
 * Maneja Copiloto IA, Cámara, Tickets CAPA, Ayuda e Historial.
 */
function useModals(globalConfig) {
    const { ref, computed, nextTick, watch, onMounted, onUnmounted } = Vue;
    const { 
        runGAS, Swal, Toast, submitting, editAsset, form, catalogs, userRoleName,
        activeFields, isNA, performSave, activeTicketEvidence, FIELD_MAP, FrontendValidator,
        isAuditMode, evaluateRepair
    } = globalConfig;

    // ==========================================
    // 1. MODAL DE AYUDA E HISTORIAL
    // ==========================================
    const helpModal = ref(false);
    const historyModal = ref({ open: false });
    const auditHistory = globalConfig.auditHistory || ref([]); // Compartido con el formulario
    const historyLoading = ref(false);
    const historySearchQuery = ref('');
    const historyFilterStatus = ref('ALL'); // 'ALL' | 'CUMPLE' | 'FALLA'
    const historyFilterPeriod = ref('ALL'); // 'ALL' | '30D' | '90D' | 'YEAR'
    const historyCurrentPage = ref(1);
    const historyItemsPerPage = ref(10);
    const expandedHistoryIds = ref(new Set());

    const toggleHistoryExpand = (key) => {
        if (expandedHistoryIds.value.has(key)) {
            expandedHistoryIds.value.delete(key);
        } else {
            expandedHistoryIds.value.add(key);
        }
    };

    const expandAllHistory = () => {
        const set = new Set();
        paginatedHistory.value.forEach((h, idx) => set.add(h.id || idx));
        expandedHistoryIds.value = set;
    };

    const collapseAllHistory = () => {
        expandedHistoryIds.value.clear();
    };

    const openAssetHistoryModal = async (asset) => {
        const target = asset || editAsset.value;
        if (!target || !target.controlNo) return;
        editAsset.value = target;
        historyModal.value.open = true;
        historySearchQuery.value = '';
        historyFilterStatus.value = 'ALL';
        historyFilterPeriod.value = 'ALL';
        historyCurrentPage.value = 1;
        expandedHistoryIds.value.clear();
        historyLoading.value = true;
        try {
            const h = await runGAS('getAssetHistory', target.controlNo);
            auditHistory.value = h || [];
        } catch (e) {
            console.error('Error fetching asset history:', e);
        } finally {
            historyLoading.value = false;
        }
    };

    const parseHistoryData = (jsonStr) => { 
        try { 
            if(!jsonStr) return {};
            const data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr; 
            const clean = {}; 
            for (const k in data) { 
                if(k === 'comments' || k === 'nextDate' || k === 'validationDate' || k === 'systemUser') continue;
                if (data[k] === null || data[k] === 'N/A' || data[k] === '') continue;
                if (typeof data[k] === 'object' && (!data[k].mantissa || data[k].mantissa === 'N/A')) continue; 
                clean[k] = data[k];
            } 
            return clean;
        } catch (e) { return {}; } 
    };

    const getHistoryComments = (jsonStr) => {
        try { 
            const d = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
            return d?.comments || null; 
        } catch(e) { return null; }
    };

    const getHistoryPhotos = (jsonStr) => {
        try { 
            const d = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
            return d?.photos || d?.fotos || d?.evidencia_fotos || []; 
        } catch(e) { return []; }
    };

    const getHistoryExpiration = (jsonStr, verifDateStr) => {
        try {
            if(jsonStr) {
                const data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
                if(data.nextDate && data.nextDate !== 'N/A') return data.nextDate;
            }
            if(!verifDateStr) return 'N/A';
            const parts = verifDateStr.split(' ')[0].split('/'); 
            if(parts.length < 3) return 'N/A';
            const date = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            date.setFullYear(date.getFullYear() + 1);
            date.setMonth(date.getMonth() + 1, 0); 
            return date.toLocaleDateString('es-MX', {day:'2-digit', month:'short', year:'2-digit'}).toUpperCase().replace('.','');
        } catch(e) { return 'N/A'; }
    };

    const formatHistoryRelativeDate = (dateStr) => {
        if (!dateStr) return '';
        try {
            let d = new Date(dateStr);
            if (isNaN(d.getTime())) {
                const clean = dateStr.replace(/-/g, '/');
                d = new Date(clean);
            }
            if (isNaN(d.getTime())) return '';
            const diffDays = Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
            if (diffDays <= 0) return 'Hoy';
            if (diffDays === 1) return 'Ayer';
            if (diffDays < 30) return `Hace ${diffDays} d`;
            const diffMonths = Math.floor(diffDays / 30);
            if (diffMonths < 12) return `Hace ${diffMonths} m`;
            return `Hace ${Math.floor(diffDays / 365)} a`;
        } catch(e) { return ''; }
    };

    const formatKey = (k) => FIELD_MAP[k]?.label || k;
    const formatValue = (v) => (typeof v === 'object' && v.mantissa) ? `${v.mantissa} x 10^${v.exponent}` : v;

    // Resumen Ejecutivo de Métricas / KPIs del Historial
    const historyKPIs = computed(() => {
        const list = auditHistory.value || [];
        const total = list.length;
        if (total === 0) return { total: 0, cumple: 0, falla: 0, rate: 100, lastAudit: null };
        
        let cumple = 0;
        list.forEach(item => {
            const res = (item.result || '').toUpperCase();
            if (res === 'CUMPLE' || res === 'PASS') cumple++;
        });
        
        const falla = total - cumple;
        const rate = Math.round((cumple / total) * 100);
        const lastAudit = list[0] || null;

        return { total, cumple, falla, rate, lastAudit };
    });

    // Filtros dinámicos
    const filteredHistory = computed(() => {
        let list = auditHistory.value || [];

        if (historyFilterStatus.value === 'CUMPLE') {
            list = list.filter(h => (h.result || '').toUpperCase() === 'CUMPLE');
        } else if (historyFilterStatus.value === 'FALLA') {
            list = list.filter(h => (h.result || '').toUpperCase() !== 'CUMPLE');
        }

        if (historyFilterPeriod.value !== 'ALL') {
            const now = new Date();
            const cutoff = new Date();
            if (historyFilterPeriod.value === '30D') cutoff.setDate(now.getDate() - 30);
            else if (historyFilterPeriod.value === '90D') cutoff.setDate(now.getDate() - 90);
            else if (historyFilterPeriod.value === 'YEAR') cutoff.setFullYear(now.getFullYear(), 0, 1);

            list = list.filter(h => {
                const target = new Date(h.rawDate || h.date);
                return !isNaN(target.getTime()) ? target >= cutoff : true;
            });
        }

        const q = (historySearchQuery.value || '').trim().toLowerCase();
        if (q) {
            list = list.filter(h => {
                const comm = (getHistoryComments(h.technicalData) || '').toLowerCase();
                const user = (h.user || '').toLowerCase();
                const d = (h.date || '').toLowerCase();
                const tech = (h.technicalData || '').toLowerCase();
                return comm.includes(q) || user.includes(q) || d.includes(q) || tech.includes(q);
            });
        }

        return list;
    });

    const historyTotalPages = computed(() => {
        return Math.ceil(filteredHistory.value.length / historyItemsPerPage.value) || 1;
    });

    const paginatedHistory = computed(() => {
        const start = (historyCurrentPage.value - 1) * historyItemsPerPage.value;
        return filteredHistory.value.slice(start, start + historyItemsPerPage.value);
    });

    watch([historyFilterStatus, historyFilterPeriod, historySearchQuery, historyItemsPerPage], () => {
        historyCurrentPage.value = 1;
    });

    // ==========================================
    // 2. COPILOTO IA (CHAT)
    // ==========================================
    const showChat = ref(false);
    const isAiTyping = ref(false);
    const userMessage = ref('');
    const chatMessages = ref([{ role: 'ai', text: '¡Hola! Selecciona con quién quieres hablar y hazme tu pregunta.' }]);
    const selectedAiPersonality = ref('');
    
    const myPersonalities = computed(() => {
        const role = userRoleName.value;
        return (catalogs.value.aiPrompts || []).filter(p => p.config?.allowedRoles?.includes(role));
    });

    watch(showChat, (val) => {
        if(val && !selectedAiPersonality.value && myPersonalities.value.length > 0) {
            selectedAiPersonality.value = myPersonalities.value[0].id;
        }
    });

    const parseMarkdown = (text) => typeof marked !== 'undefined' ? marked.parse(text) : text;

    const sendToAi = async () => {
        if (!userMessage.value.trim() || isAiTyping.value) return;
        if (!selectedAiPersonality.value) return Swal.fire("Atención", "Selecciona una personalidad antes de preguntar.", "warning");
        
        const text = userMessage.value;
        chatMessages.value.push({ role: 'user', text });
        userMessage.value = '';
        isAiTyping.value = true;
        await nextTick();
        const container = document.getElementById('chat-container');
        if(container) container.scrollTop = container.scrollHeight;

        try {
            const r = await runGAS('askGemini', text, selectedAiPersonality.value);
            chatMessages.value.push({ role: 'ai', text: r.success ? r.answer : `Error: ${r.error}` });
        } catch (e) { chatMessages.value.push({ role: 'ai', text: 'Error de conexión con el cerebro.' }); } 
        finally {
            isAiTyping.value = false;
            await nextTick();
            if(container) container.scrollTop = container.scrollHeight;
        }
    };

    // ==========================================
    // 3. TICKETS CAPA Y CÁMARA WEB
    // ==========================================
    const showTicketModal = ref(false);
    const currentTicketMode = ref('OPEN');
    const ticketForm = ref({});
    const ticketEmails = ref(['']);
    const selectedGroups = ref([]);

    const cameraActive = ref(false);
    const videoStream = ref(null);
    const capturedPhotos = ref([]);
    const previewImage = ref(null);
    const viewingEvidenceIdx = ref(null);

    // Funciones de Cámara
    const startCamera = async () => {
        cameraActive.value = true; await nextTick(); 
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            if (videoStream.value) videoStream.value.srcObject = stream;
        } catch (e) { Swal.fire('Error', 'Sin acceso a cámara.', 'error'); cameraActive.value = false; }
    };
    const stopCamera = () => { if (videoStream.value?.srcObject) videoStream.value.srcObject.getTracks().forEach(t => t.stop()); cameraActive.value = false; };
    const takePhoto = () => {
        if (!videoStream.value) return;
        const canvas = document.createElement('canvas');
        canvas.width = videoStream.value.videoWidth; canvas.height = videoStream.value.videoHeight;
        canvas.getContext('2d').drawImage(videoStream.value, 0, 0);
        capturedPhotos.value.push({ data: canvas.toDataURL('image/jpeg', 0.8) });
    };
    const removePhoto = (idx) => capturedPhotos.value.splice(idx, 1);
    const nextImage = () => { if (previewImage.value !== null) previewImage.value = (previewImage.value + 1) % capturedPhotos.value.length; };
    const prevImage = () => { if (previewImage.value !== null) previewImage.value = (previewImage.value - 1 + capturedPhotos.value.length) % capturedPhotos.value.length; };

    // Funciones de Galería
    const openGallery = (idx) => { viewingEvidenceIdx.value = idx; };
    const closeGallery = () => { viewingEvidenceIdx.value = null; };
    const nextGalleryImage = () => { 
        const fotos = activeTicketEvidence?.value?.fotos;
        if (fotos && fotos.length > 1) viewingEvidenceIdx.value = (viewingEvidenceIdx.value + 1) % fotos.length; 
    };
    const prevGalleryImage = () => { 
        const fotos = activeTicketEvidence?.value?.fotos;
        if (fotos && fotos.length > 1) viewingEvidenceIdx.value = (viewingEvidenceIdx.value - 1 + fotos.length) % fotos.length; 
    };

    // Navegación por Teclado (Flechas y Escape)
    const handleGalleryKeydown = (e) => {
        // 1. Visor de evidencia de ticket (CAPA)
        if (viewingEvidenceIdx.value !== null) {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextGalleryImage();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevGalleryImage();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeGallery();
            }
            return;
        }

        // 2. Previsualización de fotos en captura de cámara
        if (previewImage.value !== null) {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextImage();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevImage();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                previewImage.value = null;
            }
            return;
        }

        // 3. Barra espaciadora para capturar foto en cámara activa
        if (cameraActive.value && (e.code === 'Space' || e.key === ' ')) {
            const tag = document.activeElement?.tagName;
            if (!['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) {
                e.preventDefault();
                takePhoto();
            }
        }
    };

    onMounted(() => {
        window.addEventListener('keydown', handleGalleryKeydown);
    });

    onUnmounted(() => {
        window.removeEventListener('keydown', handleGalleryKeydown);
    });

    // Funciones de Correos
    const addEmailField = async () => { 
        if (ticketEmails.value[ticketEmails.value.length - 1] !== '') {
            ticketEmails.value.push(''); await nextTick(); 
            const inputs = document.querySelectorAll('.email-input-field');
            if (inputs.length > 0) inputs[inputs.length - 1].focus();
        } 
    };
    const removeEmailField = (idx) => ticketEmails.value.splice(idx, 1);
    const toggleEmailGroup = (group) => {
        const idx = selectedGroups.value.indexOf(group.id);
        if (idx > -1) selectedGroups.value.splice(idx, 1); else selectedGroups.value.push(group.id);
    };
    const isGroupSelected = (group) => selectedGroups.value.includes(group.id);
    watch(showTicketModal, (val) => { if(val) selectedGroups.value = []; }); 

    const handleFileUpload = (event, fieldId) => {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { ticketForm.value[fieldId] = { name: file.name, data: e.target.result }; };
        reader.readAsDataURL(file);
    };

    const openTicketModal = (mode = 'CLOSE') => {
        if (mode === 'CLOSE' && (!form.value.result || !isAuditMode?.value)) {
            const evalFn = evaluateRepair || globalConfig?.evaluateRepair;
            if (typeof evalFn === 'function') {
                return evalFn();
            }
        }
        ticketForm.value = {}; currentTicketMode.value = mode; 
        ticketEmails.value = ['']; capturedPhotos.value = [];
        showTicketModal.value = true;
    };

    const visibleTicketFields = computed(() => {
        if (!catalogs.value.ticketFields) return [];
        return catalogs.value.ticketFields.filter(f => {
            const cfg = f.config || {};
            if (currentTicketMode.value === 'OPEN') return cfg.showOnOpen !== false;
            if (currentTicketMode.value === 'CLOSE') return cfg.showOnClose === true;
            return true;
        });
    });

    const submitTicket = async () => {
        if (submitting.value) return;

        // Validación estricta de campos requeridos del ticket
        for (const f of visibleTicketFields.value) {
            if (f.config?.required) {
                if (f.label === 'CAMERA' && capturedPhotos.value.length === 0) {
                    return Swal.fire("Evidencia Requerida", `Debes tomar al menos una foto para "${f.id}".`, "warning");
                }
                if (f.label === 'EMAIL_LIST') {
                    const validEmails = ticketEmails.value.filter(e => !FrontendValidator.isBlank(e));
                    if (validEmails.length === 0 && selectedGroups.value.length === 0) {
                        return Swal.fire("Destinatario Requerido", `Ingresa al menos un correo o selecciona un grupo en "${f.id}".`, "warning");
                    }
                }
                if (!['CAMERA', 'EMAIL_LIST'].includes(f.label)) {
                    if (FrontendValidator.isBlank(ticketForm.value[f.id])) {
                        return Swal.fire("Campo Incompleto", `El campo "${f.id}" es obligatorio.`, "warning");
                    }
                }
            }
        }
        
        // Validación de formato de correos antes de enviar
        let finalEmails = [];
        selectedGroups.value.forEach(groupId => {
            const group = catalogs.value.emailGroups.find(g => g.id === groupId);
            if (group?.label) {
                group.label.split(',').map(e => e.trim()).filter(e => e.length > 0).forEach(em => {
                    finalEmails.push(em.toLowerCase());
                });
            }
        });

        for (const e of ticketEmails.value) {
            const clean = FrontendValidator.sanitize(e);
            if (!FrontendValidator.isBlank(clean)) {
                const fullEmail = clean.includes('@') ? clean.toLowerCase() : `${clean.toLowerCase()}@plexus.com`;
                if (!FrontendValidator.isValidEmail(fullEmail)) {
                    return Swal.fire("Correo Inválido", `"${clean}" no tiene formato de correo válido.`, "warning");
                }
                finalEmails.push(fullEmail);
            }
        }

        submitting.value = true;
        try {
            let finalFormData = { ...ticketForm.value };
            // Sanitizar valores de texto
            for (const key in finalFormData) {
                if (typeof finalFormData[key] === 'string') {
                    finalFormData[key] = FrontendValidator.sanitize(finalFormData[key]);
                }
            }

            for (const key in finalFormData) {
                const val = finalFormData[key];
                if (val?.data) {
                    const fileRes = await runGAS('uploadTicketFile', val, editAsset.value.controlNo, editAsset.value.project, editAsset.value.description);
                    if (fileRes.success) finalFormData[key] = fileRes.url; else throw new Error(fileRes.error);
                }
            }

            const passed = (form.value.result === 'CUMPLE');

            const payload = { 
                assetId: editAsset.value.controlNo, assetInfo: JSON.parse(JSON.stringify(editAsset.value)),
                formData: finalFormData, mode: currentTicketMode.value, measurements: form.value.measurements, 
                passed: passed, emails: [...new Set(finalEmails)], photos: capturedPhotos.value 
            };

            const r = await runGAS('saveTicketRecord', payload);
            if(r.success) {
                submitting.value = false;
                if (currentTicketMode.value === 'OPEN') { 
                    editAsset.value.lastResult = 'FALLA';
                    editAsset.value.openTicket = { folio: r.data?.ticketId || 'TKT', date: new Date().toISOString(), comments: finalFormData.Comentarios || '' };
                    await performSave(true); 
                    showTicketModal.value = false; 
                } else {
                    if (passed) {
                        editAsset.value.lastResult = 'CUMPLE';
                        editAsset.value.openTicket = null;
                    } else {
                        editAsset.value.lastResult = 'FALLA';
                    }
                    await performSave(true);
                    if (passed) Swal.fire("¡Ticket Cerrado!", "Las mediciones fueron aprobadas y el equipo ha sido reactivado.", "success");
                    else Swal.fire({ icon: 'warning', title: 'Seguimiento Registrado', text: 'El equipo se reportó con mediciones fuera de tolerancia. El ticket sigue ABIERTO.', confirmButtonColor: '#f59e0b' });
                    showTicketModal.value = false;
                }
            } else { 
                throw new Error(r.error || 'Error al guardar ticket'); 
            }
        } catch(e) { 
            Swal.fire("Error", e.message || 'Error en el servidor', "error"); 
        } finally {
            submitting.value = false;
        }
    };

    return {
        helpModal, historyModal, auditHistory, parseHistoryData, getHistoryComments, getHistoryPhotos, getHistoryExpiration, formatKey, formatValue,
        historyLoading, historySearchQuery, historyFilterStatus, historyFilterPeriod, historyCurrentPage, historyItemsPerPage, expandedHistoryIds,
        toggleHistoryExpand, expandAllHistory, collapseAllHistory, openAssetHistoryModal, formatHistoryRelativeDate,
        historyKPIs, filteredHistory, historyTotalPages, paginatedHistory,
        showChat, isAiTyping, userMessage, chatMessages, selectedAiPersonality, myPersonalities, sendToAi, parseMarkdown,
        showTicketModal, currentTicketMode, ticketForm, ticketEmails, selectedGroups, cameraActive, videoStream, capturedPhotos, previewImage, viewingEvidenceIdx,
        startCamera, stopCamera, takePhoto, removePhoto, nextImage, prevImage, openGallery, openSweetGallery: openGallery, closeGallery, nextGalleryImage, prevGalleryImage,
        addEmailField, removeEmailField, toggleEmailGroup, isGroupSelected, handleFileUpload, openTicketModal, visibleTicketFields, submitTicket
    };
}
</script>
