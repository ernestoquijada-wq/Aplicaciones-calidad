<script>
/**
 * 🟢 COMPOSABLE: LÓGICA DEL FORMULARIO DE ACTIVOS
 * Maneja altas, auditorías, N/A, alertas matemáticas y guardado.
 */
function useAssetForm(globalConfig) {
    const { ref, computed, watch, nextTick } = Vue;
    // Extraemos las dependencias globales que le pasaremos desde el Main
    const { 
        view, submitting, assets, dbRules, catalogs, statusDB, currentThemeColor, 
        loadData, openTicketModal, runGAS, Swal, Toast, FIELD_MAP, FrontendValidator,
        currentUser, ESDMath: injectedESDMath 
    } = globalConfig;
    const mathEngine = injectedESDMath || (typeof ESDMath !== 'undefined' ? ESDMath : window.ESDMath);

    // 1. ESTADO LOCAL DEL FORMULARIO
    const editAsset = ref({});
    const form = ref({ measurements:{}, result: '', validationDate: '' });
    const isNewAsset = ref(false);
    const isAuditMode = ref(false);
    const activeInput = ref(null);
    const auditHistory = ref([]);
    const activeTicketEvidence = ref(null);

    // 2. COMPUTADOS
    const sectorColor = computed(() => currentThemeColor.value);
    const sectorLabel = computed(() => { 
        if(!editAsset.value.quadrant) return 'AUTO';
        const search = String(editAsset.value.quadrant).toUpperCase().trim();
        const sector = catalogs.value.sectors.find(s => s.id.toUpperCase() === search);
        return sector ? sector.label : 'NO ENCONTRADO'; 
    });

    const isStatusBaja = computed(() => {
        const s = (editAsset.value?.status || '').toUpperCase().trim();
        return ['BAJA', 'SCRAP', 'OBSOLETO', 'DESINCORPORADO'].includes(s);
    });

    const isCurrentStatusAdmin = computed(() => {
        const stName = (editAsset.value?.status || '').toUpperCase().trim();
        if (!stName) return false;
        const defaultAdminStatuses = ['BAJA', 'SCRAP', 'INACTIVO', 'OBSOLETO', 'DESINCORPORADO', 'MOVIMIENTO', 'INSTALACIÓN', 'INSTALACION'];
        if (defaultAdminStatuses.includes(stName)) return true;
        const st = (statusDB.value || []).find(s => (s.name || '').toUpperCase().trim() === stName);
        return st ? (st.isAdmin === true || String(st.isAdmin).toLowerCase() === 'true') : false;
    });

    const isAssetFailed = computed(() => {
        const lr = (editAsset.value?.lastResult || '').toUpperCase();
        const st = (editAsset.value?.status || '').toUpperCase();
        const res = (form.value?.result || '').toUpperCase();
        return lr === 'FALLA' || lr === 'NO CUMPLE' || lr === 'FAIL' || st === 'FALLA' || res === 'FALLA' || res === 'NO CUMPLE' || !!activeTicketEvidence.value || !!editAsset.value?.openTicket;
    });

    const formatLimit = (field) => {
        if (!field) return 'N/A';
        if (field.specText) return field.specText;
        if (field.type === 'scientific' && field.limit?.m && field.limit?.e) {
            return `< ${field.limit.m}E${field.limit.e}`;
        }
        if (field.limitInfo && field.limitInfo.value != null) {
            return `${field.limitInfo.operator} ${field.limitInfo.value}`;
        }
        if (field.limit) return `< ${field.limit}`;
        return 'N/A';
    };

    // 🟢 MAGIA MATEMÁTICA: Genera los campos dinámicos según el Activo
    const activeFields = computed(() => {
       if(!editAsset.value.description) return [];
       const rule = dbRules.value[editAsset.value.description] || {};
       const fields = [];
       const specificRecs = rule.recs || {}; 

       for(const k in FIELD_MAP) {
          if(rule[k]) {
             if(!form.value.measurements[k]) form.value.measurements[k] = FIELD_MAP[k].type === 'scientific' ? {mantissa:null, exponent:null} : null;
             
             const parsed = mathEngine ? mathEngine.parseLimit(rule[k]) : null;
             let limitM=0, limitE=0, limitVal=0;
             if(FIELD_MAP[k].type === 'scientific') { 
                 try { 
                     const parts = String(rule[k]).toUpperCase().replace(/[<>=]/g,'').trim().split('E'); 
                     limitM=parseFloat(parts[0]); 
                     limitE=parseFloat(parts[1].replace('+','')); 
                 } catch(e){} 
             } else { 
                 limitVal = parsed ? parsed.value : parseFloat(String(rule[k]).replace(/[<>=a-zA-Z]/g, '')); 
             }
             
             const tolerance = rule.tolerance ? parseFloat(rule.tolerance) : 0.8; 
             const finalRec = specificRecs[k] || rule.recommendation || "Revisar parámetros.";

             fields.push({ 
                 key: k, 
                 ...FIELD_MAP[k], 
                 limitInfo: parsed,
                 limit: FIELD_MAP[k].type === 'scientific' ? {m:limitM, e:limitE} : limitVal, 
                 specText: rule[k], 
                 recText: finalRec, 
                 tolerance: tolerance 
             });
          }
       }
       return fields;
    });

    // 3. MÉTODOS Y HELPERS
    const isNA = (key) => {
        const val = form.value.measurements[key];
        if(!val) return false;
        if(typeof val === 'string' && val === 'N/A') return true;
        if(typeof val === 'object' && val.mantissa === 'N/A') return true;
        return false;
    };
    
    const toggleNA = (key) => {
        if(isNA(key)) {
            form.value.measurements[key] = FIELD_MAP[key].type === 'scientific' ? {mantissa:null, exponent:null} : null;
        } else {
            form.value.measurements[key] = FIELD_MAP[key].type === 'scientific' ? {mantissa:'N/A', exponent:'N/A'} : 'N/A';
        }
    };
    
    const getAlert = (field) => {
       if(isNA(field.key)) return {message:'NO APLICA', class:'bg-slate-100 text-slate-500', borderClass:'border-slate-200 bg-slate-50'};
       const val = form.value.measurements[field.key];
       if(!val) return {message:''};
       
       let num = null;
       if(field.type === 'scientific') {
          if(val.mantissa==null || val.exponent==null || val.mantissa==="" || val.exponent==="") return {message:''};
          num = Number(val.mantissa) * Math.pow(10, Number(val.exponent));
       } else { 
          if(val==="" || val===null) return {message:''};
          num = Number(val); 
       }
       if(isNaN(num) || num === null) return {message:''};
       
       if (mathEngine) {
           const limitInfo = field.limitInfo || mathEngine.parseLimit(field.specText || field.limit);
           return mathEngine.evaluate(num, limitInfo, field.tolerance);
       }

       let limit = 0;
       if(field.type === 'scientific') {
          limit = field.limit.m * Math.pow(10, field.limit.e);
       } else { 
          limit = Number(field.limit); 
       }
       if(!limit) return {message:''};
       
       if(num >= limit) return {message:'FUERA DE RANGO', class:'bg-rose-100 text-rose-600', borderClass:'border-rose-300 bg-rose-50/30', showRec:true};
       if(num >= (limit * (field.tolerance || 0.8))) return {message:'RIESGO', class:'bg-amber-100 text-amber-600', borderClass:'border-amber-300 bg-amber-50/30', showRec:true};
       
       return {message:'OK', class:'bg-emerald-100 text-emerald-600', borderClass:'border-emerald-300 bg-emerald-50/20', showRec:false};
    };

    // ==========================================
    // 🔒 CONTROL DE PRESENCIA Y CONCURRENCIA EN VIVO
    // ==========================================
    let presenceTimer = null;
    let lockedAssetId = null;

    const stopPresenceHeartbeat = () => {
        if (presenceTimer) {
            clearInterval(presenceTimer);
            presenceTimer = null;
        }
    };

    const startPresenceHeartbeat = (assetId) => {
        stopPresenceHeartbeat();
        lockedAssetId = assetId;
        presenceTimer = setInterval(async () => {
            if (!lockedAssetId || view.value !== 'form') {
                stopPresenceHeartbeat();
                return;
            }
            try {
                const userEmail = (currentUser && currentUser.value) || '';
                const res = await runGAS('renewAssetPresence', lockedAssetId, userEmail);
                if (res && res.status === 'OVERRIDDEN') {
                    stopPresenceHeartbeat();
                    Toast.fire({ 
                        icon: 'warning', 
                        title: `El usuario ${res.byUser || 'otro auditor'} tomó el control de este activo.` 
                    });
                }
            } catch (e) {
                console.warn('Error renovando presencia:', e);
            }
        }, 30000);
    };

    const releasePresence = async (assetId) => {
        stopPresenceHeartbeat();
        const targetId = assetId || lockedAssetId || editAsset.value?.controlNo;
        lockedAssetId = null;
        if (targetId && !isNewAsset.value) {
            try {
                const userEmail = (currentUser && currentUser.value) || '';
                await runGAS('releaseAssetPresence', targetId, userEmail);
            } catch (e) {
                console.warn('Error liberando presencia:', e);
            }
        }
    };

    const startNewAsset = () => { 
        releasePresence();
        isNewAsset.value = true; 
        editAsset.value = { status: 'ACTIVO' };
        currentThemeColor.value = '#005565'; 
        view.value = 'form'; 
        isAuditMode.value = true; 
        form.value = { measurements: {}, result: '' };
        auditHistory.value = []; 
        activeTicketEvidence.value = null;
    };
    
    const selectAsset = async (a) => {
       if (!a || !a.controlNo) return;

       if (lockedAssetId && lockedAssetId !== a.controlNo) {
           releasePresence(lockedAssetId);
       }

       // 🔒 Verificación de Presencia en Tiempo Real
       const userEmail = (currentUser && currentUser.value) || '';
       const userName = userEmail ? userEmail.split('@')[0] : 'Auditor';

       try {
           const presRes = await runGAS('acquireAssetPresence', {
               assetId: a.controlNo,
               userEmail: userEmail,
               userName: userName,
               force: false
           });

           if (presRes && presRes.status === 'LOCKED') {
               const holder = presRes.holder || {};
               const holderName = holder.userName || holder.userEmail || 'Otro usuario';
               const elapsedText = holder.elapsedSeconds !== undefined ? ` (hace ${holder.elapsedSeconds}s)` : '';

               const confirmRes = await Swal.fire({
                   title: 'Medición en Proceso',
                   html: `<div class="text-left text-sm text-slate-700">
                            <p class="mb-2">El usuario <b class="text-amber-600 font-bold">${holderName}</b>${elapsedText} se encuentra actualmente realizando una medición en este activo (<b>${a.controlNo}</b>).</p>
                            <p class="text-xs text-slate-500 mt-2">¿Deseas registrar la información de todos modos o tomar el control?</p>
                          </div>`,
                   icon: 'warning',
                   showCancelButton: true,
                   showDenyButton: true,
                   confirmButtonColor: '#005565',
                   denyButtonColor: '#f59e0b',
                   cancelButtonColor: '#64748b',
                   confirmButtonText: '<i class="fas fa-hand-paper mr-1"></i> Tomar el Control',
                   denyButtonText: '<i class="fas fa-edit mr-1"></i> Continuar de todos modos',
                   cancelButtonText: 'Regresar'
               });

               if (confirmRes.isConfirmed) {
                   try {
                       await runGAS('acquireAssetPresence', {
                           assetId: a.controlNo,
                           userEmail: userEmail,
                           userName: userName,
                           force: true
                       });
                       startPresenceHeartbeat(a.controlNo);
                   } catch (err) {
                       console.warn('Error al forzar presencia:', err);
                   }
               } else if (confirmRes.isDenied) {
                   stopPresenceHeartbeat();
               } else {
                   return;
               }
           } else {
               startPresenceHeartbeat(a.controlNo);
           }
       } catch (err) {
           console.warn('No se pudo verificar presencia, procediendo:', err);
       }

       isNewAsset.value = false;
       editAsset.value = JSON.parse(JSON.stringify(a));
       const q = catalogs.value.sectors.find(x => x.id.toUpperCase() === (a.quadrant||'').toUpperCase());
       currentThemeColor.value = q ? q.hex : '#005565';
       isAuditMode.value = false;
       form.value = { measurements:{}, result:'', validationDate: new Date().toISOString().split('T')[0] };
       
       if(a.measurements) {
           for(const k in a.measurements) {
               if(a.measurements[k]) form.value.measurements[k] = JSON.parse(JSON.stringify(a.measurements[k]));
           }
       }
       
       view.value = 'form';
       auditHistory.value = [];
       runGAS('getAssetHistory', a.controlNo).then(h => auditHistory.value = h);
       
       activeTicketEvidence.value = null;
       if (a.openTicket) {
           activeTicketEvidence.value = {
               folio: a.openTicket.folio,
               fecha: a.openTicket.date,
               comentarios: a.openTicket.comments || '',
               fotos: []
           };
       }
       const rStatus = (a.lastResult || '').toUpperCase();
       const isAdministrative = statusDB.value.find(s => s.name.toUpperCase() === rStatus)?.isAdmin;
       if ((a.openTicket || (rStatus && !['CUMPLE', 'PASS', 'OK', 'PENDIENTE'].includes(rStatus))) && !isAdministrative) {
           runGAS('getActiveTicketData', a.controlNo).then(data => { 
               if (data) activeTicketEvidence.value = data; 
           });
       }
    };

    const prepareForMeasurementCapture = () => {
        isAuditMode.value = true;
        (nextTick || Vue.nextTick)(() => {
            const el = document.getElementById('measurements-card');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (activeFields.value && activeFields.value.length > 0) {
                activeInput.value = activeFields.value[0].key;
            }
        });
    };

    const evaluateRepair = () => {
        // 1. Si no está en modo auditoría o no se han capturado lecturas, activar modo y guiar al técnico
        if (!isAuditMode.value) {
            prepareForMeasurementCapture();
            Swal.fire({
                icon: 'info',
                title: 'Captura de Mediciones Requerida',
                html: `<p class="text-sm text-slate-600">Para dar seguimiento o cerrar el ticket de este equipo, <b>primero debes capturar las nuevas lecturas técnicas</b> de verificación.</p>
                       <p class="text-xs text-[#005565] font-bold mt-2"><i class="fas fa-arrow-down mr-1"></i> Hemos habilitado los campos de medición a continuación.</p>`,
                confirmButtonColor: '#005565',
                confirmButtonText: 'Entendido, capturar lecturas'
            });
            return;
        }

        // 2. Validar que los campos activos no estén vacíos
        let validMeasurementsCount = 0;
        for (const field of activeFields.value) {
            if (isNA(field.key)) continue; 
            
            const val = form.value.measurements[field.key];
            let isEmpty = false;
            
            if (field.type === 'scientific') { 
                if (val == null || FrontendValidator.isBlank(val.mantissa) || FrontendValidator.isBlank(val.exponent)) isEmpty = true;
            } else { 
                if (FrontendValidator.isBlank(val)) isEmpty = true;
            }
            
            if (isEmpty) {
                activeInput.value = field.key;
                const el = document.getElementById('measurements-card');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                Swal.fire({ 
                    icon: 'warning', 
                    title: 'Faltan Mediciones', 
                    text: `Debes registrar una medición real para "${field.label}" o marcar 'N/A'.`, 
                    confirmButtonColor: '#005565' 
                });
                return;
            } else { 
                validMeasurementsCount++;
            }
        }

        if (validMeasurementsCount === 0 && activeFields.value.length > 0) {
            Swal.fire({ 
                icon: 'error', 
                title: 'Medición Obligatoria', 
                text: 'Para evaluar la reparación, debes capturar al menos un valor numérico real (no todo puede ser N/A).', 
                confirmButtonColor: '#e11d48' 
            });
            return;
        }

        // 3. Evaluación técnica contra reglas ESD
        const failures = activeFields.value.filter(f => getAlert(f).message === 'FUERA DE RANGO');

        if (failures.length === 0) {
            // Todas las mediciones cumplen tolerancias
            form.value.result = 'CUMPLE';
            Swal.fire({
                icon: 'success',
                title: '¡Mediciones Aprobadas!',
                html: `<div class="text-left bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-xs text-emerald-800 mb-3">
                         <p class="font-bold flex items-center gap-1"><i class="fas fa-check-circle text-emerald-600"></i> Todas las lecturas técnicas cumplen con las tolerancias ESD.</p>
                       </div>
                       <p class="text-sm text-slate-600">A continuación, completa el formulario de Cierre de Ticket (CAPA) para documentar la acción correctiva y reactivar el equipo.</p>`,
                confirmButtonColor: '#005565',
                confirmButtonText: '<i class="fas fa-clipboard-check mr-1"></i> Proceder al Cierre CAPA'
            }).then((r) => { 
                if (r.isConfirmed) {
                    openTicketModal('CLOSE');
                }
            });
        } else {
            // Mediciones siguen fuera de rango
            form.value.result = 'NO CUMPLE';
            let failList = failures.map(f => `<li class="mb-1"><b>${f.label}</b>: ${f.recText || 'Lectura fuera de especificación'}</li>`).join('');
            Swal.fire({
                icon: 'warning',
                title: 'Mediciones Fuera de Rango',
                html: `<p class="text-sm text-slate-600 mb-2">Las mediciones registradas <b>NO cumplen</b> las tolerancias requeridas:</p>
                       <ul class="text-xs text-rose-700 text-left bg-rose-50 p-3 rounded-lg border border-rose-200 list-disc pl-6 mb-3">${failList}</ul>
                       <p class="text-xs text-slate-500">¿Deseas registrar un <b>seguimiento intermedio</b> (el ticket seguirá ABIERTO) o prefieres <b>seguir reparando</b>?</p>`,
                showCancelButton: true,
                confirmButtonColor: '#f59e0b',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<i class="fas fa-clipboard-list mr-1"></i> Registrar Seguimiento',
                cancelButtonText: '<i class="fas fa-tools mr-1"></i> Seguir Reparando'
            }).then((r) => { 
                if (r.isConfirmed) {
                    openTicketModal('CLOSE');
                }
            });
        }
    };

    const performSave = async (forced = false) => {
       if (submitting.value && !forced) return;
       submitting.value = true;
       try {
           editAsset.value.colorCode = currentThemeColor.value;
           
           // Sanitización de strings en el activo
           if (editAsset.value) {
               ['responsible', 'factory', 'project', 'quadrant', 'description', 'status', 'brand', 'model', 'serialNo'].forEach(key => {
                   if (typeof editAsset.value[key] === 'string') {
                       editAsset.value[key] = FrontendValidator.sanitize(editAsset.value[key]);
                   }
               });
           }
           
           const emailEv = activeFields.value.map(f => {
               let valStr = "N/A";
               const val = form.value.measurements[f.key];
               if (val && !isNA(f.key)) {
                   if (f.type === 'scientific') {
                       if (val.mantissa !== null && val.mantissa !== "") valStr = `${val.mantissa} x 10^${val.exponent}`;
                   } else {
                       if (val !== null && val !== "") valStr = String(val);
                   }
               }
               return { label: f.label, value: valStr }; 
           });
           form.value.emailEvidence = emailEv; 

           const m = form.value.measurements;
           for (const field of activeFields.value) {
               const key = field.key;
               if (!m[key]) { m[key] = field.type === 'scientific' ? { mantissa: 'N/A', exponent: 'N/A' } : 'N/A'; }
           }
           
           // Si el resultado de la auditoría es NO CUMPLE / FALLA, reflejar en editAsset.lastResult
           const resNorm = (form.value.result || '').toUpperCase();
            if (isStatusBaja.value || resNorm === 'BAJA') {
                editAsset.value.lastResult = 'BAJA';
                form.value.result = 'BAJA';
                editAsset.value.status = 'Baja';
            } else if (resNorm === 'NO CUMPLE' || resNorm === 'FAIL' || resNorm === 'FALLA') {
                editAsset.value.lastResult = 'FALLA';
                form.value.result = 'FALLA';
            } else if (resNorm === 'CUMPLE' || resNorm === 'PASS') {
                editAsset.value.lastResult = 'CUMPLE';
                form.value.result = 'CUMPLE';
            }

            // Asegurar que status en Col G mantenga un motivo válido
            if (!editAsset.value.status) {
                editAsset.value.status = 'Validación';
            }

           // Actualización reactiva optimista local (0ms en UI)
           if (assets && assets.value && editAsset.value?.controlNo) {
               const localIdx = assets.value.findIndex(a => String(a.controlNo).trim().toUpperCase() === String(editAsset.value.controlNo).trim().toUpperCase());
               if (localIdx !== -1) {
                   assets.value[localIdx].status = editAsset.value.status;
                   assets.value[localIdx].lastResult = form.value.result || editAsset.value.lastResult;
                   assets.value[localIdx].responsible = editAsset.value.responsible;
                   assets.value[localIdx].quadrant = editAsset.value.quadrant;
                   if (form.value.measurements) {
                       assets.value[localIdx].measurements = JSON.parse(JSON.stringify(form.value.measurements));
                   }
                   if (isStatusBaja.value) {
                        assets.value[localIdx].openTicket = null;
                    } else if (editAsset.value.openTicket !== undefined) {
                        assets.value[localIdx].openTicket = editAsset.value.openTicket;
                    }
               }
           }

           const payload = { asset: JSON.parse(JSON.stringify(editAsset.value)), formData: JSON.parse(JSON.stringify({...form.value, isAudit: isAuditMode.value})) };
           const r = isNewAsset.value ? await runGAS('saveNewAsset', payload) : await runGAS('processAudit', payload);
           if(r.success) { 
               releasePresence(editAsset.value?.controlNo);
               Toast.fire({ icon: 'success', title: isNewAsset.value ? 'Activo Registrado' : 'Verificación Guardada' });
               await loadData(true); 
               view.value = 'dashboard'; 
           } else { 
               throw new Error(r.error || 'Error al guardar'); 
           }
       } catch(e) { 
           Swal.fire({ icon: 'error', title: 'Error al Guardar', text: e.message || 'Error desconocido del servidor.' }); 
       } finally {
           submitting.value = false;
       }
    };

    const submit = async (resultType) => {
       if (submitting.value) return;
       
       // Validación estricta anti-nulos/vacíos con FrontendValidator
       if (FrontendValidator.isBlank(editAsset.value.status) || 
           FrontendValidator.isBlank(editAsset.value.responsible) || 
           FrontendValidator.isBlank(editAsset.value.factory) || 
           FrontendValidator.isBlank(editAsset.value.project) || 
           FrontendValidator.isBlank(editAsset.value.quadrant) || 
           FrontendValidator.isBlank(editAsset.value.description)) {
           Swal.fire({ 
               icon: 'warning', 
               title: 'Datos Incompletos', 
               text: 'Por favor completa todos los campos requeridos: Estado, Responsable, Fábrica, Proyecto, Cuadrante y Tipo.', 
               confirmButtonColor: '#005565' 
           });
           return;
       }

       if (resultType === 'ADMIN') {
            for(const field of activeFields.value) { form.value.measurements[field.key] = field.type === 'scientific' ? {mantissa:'N/A', exponent:'N/A'} : 'N/A'; }
            const isBaja = isStatusBaja.value;
            form.value.result = isBaja ? 'BAJA' : editAsset.value.status;
            form.value.requiresSecondRevision = false; 
            isAuditMode.value = true; 
            Swal.fire({ 
                title: isBaja ? '¿Confirmar Baja de Activo?' : 'Confirmar Movimiento', 
                html: isBaja 
                    ? `<div class="text-left bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-700 space-y-2">
                         <p>El activo <b>ID: ${editAsset.value.controlNo}</b> (${editAsset.value.description}) cambiará a estado de <b>BAJA</b>.</p>
                         <p class="text-rose-600 font-bold"><i class="fas fa-ban mr-1"></i> Se desincorporará de las auditorías periódicas y no se exigirán lecturas técnicas.</p>
                         ${form.value.comments ? `<p class="mt-2 text-slate-500 italic"><b>Observaciones:</b> ${form.value.comments}</p>` : `<p class="text-[11px] text-amber-700"><b>Nota:</b> Puedes detallar el motivo de scrap o retiro en Observaciones.</p>`}
                       </div>`
                    : `<p>Se registrará como <b>${editAsset.value.status}</b> sin requerir lecturas técnicas.</p>`, 
                icon: isBaja ? 'warning' : 'info', 
                showCancelButton: true, 
                confirmButtonColor: isBaja ? '#334155' : '#005565', 
                cancelButtonColor: '#94a3b8',
                confirmButtonText: isBaja ? '<i class="fas fa-ban mr-1"></i> Sí, Dar de Baja' : 'Sí, Registrar',
                cancelButtonText: 'Cancelar'
            }).then((r) => { 
                if(r.isConfirmed) performSave(); 
            });
            return; 
        }

       let validMeasurementsCount = 0;
       for(const field of activeFields.value) {
           if(!isNA(field.key)) {
               const val = form.value.measurements[field.key];
               let isEmpty = false;
               if(field.type === 'scientific') { 
                   if(val == null || FrontendValidator.isBlank(val.mantissa) || FrontendValidator.isBlank(val.exponent)) isEmpty = true; 
               } else { 
                   if(FrontendValidator.isBlank(val)) isEmpty = true; 
               }
               
               if(isEmpty) { 
                   activeInput.value = field.key;
                   Swal.fire({ icon: 'warning', title: 'Faltan Mediciones', text: `Debes registrar una medición para ${field.label} o marcar 'N/A'.`, confirmButtonColor: '#005565' });
                   return; 
               } else { 
                   validMeasurementsCount++; 
               }
           }
       }
       
       if (validMeasurementsCount === 0 && activeFields.value.length > 0) { 
           Swal.fire({ icon: 'error', title: 'Auditoría Inválida', text: 'No puedes registrar una auditoría con todas las mediciones en "N/A". Debes capturar al menos un número real.', confirmButtonColor: '#e11d48' });
           return; 
       }
       
       const failures = activeFields.value.filter(f => getAlert(f).message === 'FUERA DE RANGO');
       form.value.requiresSecondRevision = false; 

       if(isNewAsset.value) {
           const calculatedResult = failures.length > 0 ? 'NO CUMPLE' : 'CUMPLE';
           if (failures.length > 0) { 
               Swal.fire({ title: '¡Alerta!', text: 'Un equipo nuevo no puede fallar en su primera verificación.', icon: 'error' });
               return; 
           }
           form.value.result = calculatedResult; 
           performSave();
           return;
       }

       const isMathFail = failures.length > 0;
       const isUserFail = (resultType === 'FAIL' || resultType === 'NO CUMPLE');
       
       if (isMathFail && !isUserFail) {
            let recsHtml = '<div class="text-left text-xs bg-rose-50 p-3 rounded border border-rose-100 max-h-40 overflow-y-auto">';
            failures.forEach(f => { recsHtml += `<div class="mb-2 last:mb-0 border-b border-rose-100 pb-2 last:border-0 last:pb-0"><p class="font-bold text-rose-700 uppercase mb-0.5"><i class="fas fa-exclamation-triangle mr-1"></i> ${f.label}</p><p class="text-slate-600 pl-4">${f.recText || 'Sin recomendación específica.'}</p></div>`; });
            recsHtml += '</div>';

            Swal.fire({
                title: '¡ALERTA DE CALIDAD!',
                html: `<div class="mb-4"><p class="text-sm text-slate-600 mb-2">Las mediciones indican FALLA, pero intentas APROBAR el equipo.</p>${recsHtml}</div><p class="font-bold text-rose-600 text-center mt-4">Si fuerzas la aprobación, se notificará a Gerencia.</p>`,
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'SÍ, APROBAR', cancelButtonText: 'CORREGIR'
            }).then((r) => { 
                if (r.isConfirmed) {
                    form.value.requiresSecondRevision = true; 
                    form.value.result = 'CUMPLE';
                    if (isAssetFailed.value) { openTicketModal('CLOSE'); } else { performSave(); }
                }
            });
            return;
       } 
       
       if (!isMathFail && isUserFail) {
            Swal.fire({
               title: '¡VERIFICACIÓN DE CRITERIO!',
               html: `<div class="text-left"><p class="mb-3 text-sm text-slate-600">Las mediciones están <b>OK</b>, pero intentas RECHAZARLO.</p><p class="font-bold text-slate-800 text-center">¿Confirmas la falla (Ej. Daño visual)?</p></div>`,
               icon: 'question', showCancelButton: true, confirmButtonColor: '#005565', confirmButtonText: 'SÍ, REGISTRAR FALLA', cancelButtonText: 'REVISAR'
           }).then((r) => { 
               if (r.isConfirmed) {
                   form.value.requiresSecondRevision = true; 
                   form.value.result = 'NO CUMPLE';
                   if (isAssetFailed.value) { openTicketModal('CLOSE'); } else { openTicketModal('OPEN'); }
               }
           });
           return;
       }

       form.value.result = resultType;
       
       if (isAssetFailed.value) { openTicketModal('CLOSE'); } 
       else if (isUserFail) { openTicketModal('OPEN'); } 
       else { performSave(); }
    };

    // 4. WATCHERS
    watch(() => editAsset.value?.status, (newStatus) => {
        const s = (newStatus || '').toUpperCase().trim();
        if (['BAJA', 'SCRAP', 'OBSOLETO', 'DESINCORPORADO', 'MOVIMIENTO', 'INSTALACIÓN', 'INSTALACION'].includes(s) || isCurrentStatusAdmin.value) {
            for (const key in FIELD_MAP) {
                form.value.measurements[key] = FIELD_MAP[key].type === 'scientific' ? { mantissa: 'N/A', exponent: 'N/A' } : 'N/A';
            }
        }
    });

    watch(() => editAsset.value.quadrant, (val) => {
        if(!val) { currentThemeColor.value = '#005565'; return; }
        const search = String(val).toUpperCase().trim();
        const sector = catalogs.value.sectors.find(s => s.id.toUpperCase() === search);
        currentThemeColor.value = sector ? sector.hex : '#005565';
    });

    watch(isAuditMode, (newVal) => {
        if (isNewAsset.value) return; 

        if (newVal === true) {
            const cleanMeas = {};
            for (const key in FIELD_MAP) {
                if (FIELD_MAP[key].type === 'scientific') {
                    cleanMeas[key] = { mantissa: null, exponent: null };
                } else {
                    cleanMeas[key] = null;
                }
            }
            form.value.measurements = cleanMeas;
            form.value.result = ''; 
            form.value.comments = ''; 
            form.value.validationDate = new Date().toISOString().split('T')[0];
        } else {
            if (editAsset.value.measurements) {
                 form.value.measurements = JSON.parse(JSON.stringify(editAsset.value.measurements));
            }
            form.value.comments = editAsset.value.comments || '';
             if(editAsset.value.lastDate) {
                 form.value.validationDate = editAsset.value.lastDate;
             }
        }
    });

    watch(view, (newVal, oldVal) => {
        if (oldVal === 'form' && newVal !== 'form') {
            releasePresence();
        }
    });

    if (typeof window !== 'undefined') {
        window.addEventListener('beforeunload', () => {
            releasePresence();
        });
    }

    // 5. EXPORTAR TODO AL MAIN
    return {
        editAsset, form, isNewAsset, isAuditMode, activeInput, auditHistory, activeTicketEvidence,
        sectorColor, sectorLabel, isCurrentStatusAdmin, isStatusBaja, activeFields, isAssetFailed, formatLimit,
        isNA, toggleNA, getAlert, startNewAsset, selectAsset, evaluateRepair, prepareForMeasurementCapture, submit, performSave,
        releasePresence
    };
}
</script>
