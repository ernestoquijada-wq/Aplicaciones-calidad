<script>
/**
 * 🟢 COMPOSABLE: LÓGICA DEL ENCABEZADO Y SISTEMA DE TRADUCCIÓN CON CACHESERVICE
 * Maneja el cambio de 4 idiomas (ES, EN, ZH, TH), persistencia en CacheService,
 * traducciones de estados, veredictos matemáticos, mapeo de catálogos y batching con LanguageApp.
 */

// Caché reactivo global en cliente para traducciones dinámicas
const dynamicTranslationsCache = Vue.reactive({});
const pendingTranslations = new Set();
const batchQueue = new Map();
let batchTimer = null;

// Pre-cargar desde sessionStorage si existe
try {
    for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && k.startsWith('trans_')) {
            const cacheKey = k.substring(6);
            dynamicTranslationsCache[cacheKey] = sessionStorage.getItem(k);
        }
    }
} catch (e) {}

function useHeader() {
    // Hook de Vue-i18n en ámbito global
    const { locale } = VueI18n.useI18n({ useScope: 'global' });
    const showLangDropdown = Vue.ref(false);

    const availableLanguages = [
        { code: 'ES', name: 'Español', flag: '🇲🇽', label: 'ES' },
        { code: 'EN', name: 'English', flag: '🇺🇸', label: 'EN' },
        { code: 'ZH', name: '中文 (简体)', flag: '🇨🇳', label: 'ZH' },
        { code: 'TH', name: 'ภาษาไทย', flag: '🇹🇭', label: 'TH' }
    ];

    const currentLanguage = Vue.computed(() => {
        return availableLanguages.find(l => l.code === locale.value) || availableLanguages[0];
    });

    /**
     * Hidrata la caché de traducciones desde el paquete inicial de CacheService (getData)
     * y sincroniza los diccionarios estáticos hacia CacheService si aún no están cacheados.
     */
    const hydrateTranslationCache = (bundle) => {
        if (!bundle || typeof bundle !== 'object') return;
        if (bundle.dynamic && typeof bundle.dynamic === 'object') {
            Object.entries(bundle.dynamic).forEach(([langKey, dict]) => {
                if (dict && typeof dict === 'object') {
                    Object.entries(dict).forEach(([srcText, translatedText]) => {
                        const cacheKey = `${langKey.toUpperCase()}:${srcText}`;
                        dynamicTranslationsCache[cacheKey] = translatedText;
                        try {
                            sessionStorage.setItem('trans_' + cacheKey, translatedText);
                        } catch (e) {}
                    });
                }
            });
        }
        if (bundle.hasStaticCache === false && typeof messages !== 'undefined' && typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withFailureHandler(() => {})
                .syncStaticTranslationCache(messages);
        }
    };

    const setLanguage = (langCode) => {
        if (['ES', 'EN', 'ZH', 'TH'].includes(langCode)) {
            locale.value = langCode;
            try {
                localStorage.setItem('ESD_LANG', langCode);
            } catch (e) {
                console.warn('No se pudo guardar la preferencia de idioma en localStorage:', e);
            }
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withFailureHandler(() => {}).logClientInteraction('LANG_SWITCH', `Idioma cambiado a ${langCode}`);
            }
        }
        showLangDropdown.value = false;
    };

    const toggleLanguage = () => {
        const order = ['ES', 'EN', 'ZH', 'TH'];
        const nextIdx = (order.indexOf(locale.value) + 1) % order.length;
        setLanguage(order[nextIdx]);
    };

    /**
     * Procesa en lote las traducciones pendientes hacia Apps Script (CacheService + LanguageApp)
     */
    const flushTranslationBatch = () => {
        batchTimer = null;
        if (batchQueue.size === 0) return;

        for (const [lang, textsSet] of batchQueue.entries()) {
            const texts = Array.from(textsSet);
            batchQueue.delete(lang);
            if (!texts.length) continue;

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((resMap) => {
                        if (resMap && typeof resMap === 'object') {
                            Object.entries(resMap).forEach(([orig, translated]) => {
                                const cKey = lang + ':' + orig;
                                pendingTranslations.delete(cKey);
                                if (translated && typeof translated === 'string') {
                                    dynamicTranslationsCache[cKey] = translated;
                                    try {
                                        sessionStorage.setItem('trans_' + cKey, translated);
                                    } catch (e) {}
                                }
                            });
                        }
                    })
                    .withFailureHandler((err) => {
                        texts.forEach(t => pendingTranslations.delete(lang + ':' + t));
                        console.warn('Error en lote de traducción dinámica:', err);
                    })
                    .translateBatch(texts, lang.toLowerCase(), '');
            }
        }
    };

    /**
     * Traduce valores dinámicos (tipos, mediciones, veredictos, catálogos, estados o texto libre).
     * 1. Consulta el diccionario local i18n según clave normalizada.
     * 2. Si no existe en el diccionario y el idioma != 'ES', consulta la caché dinámica reactiva (hidratada desde CacheService).
     * 3. Si no está en caché, encola en lote hacia translateBatch en servidor (LanguageApp + CacheService).
     */
    const translateDynamic = (val, category = '') => {
        if (val === null || val === undefined || val === '') return '';
        const strVal = String(val).trim();
        if (!strVal) return '';

        const lang = locale.value || 'ES';
        const rawKey = strVal.toUpperCase().replace(/[\s\.\-]+/g, '_');
        const normKey = rawKey.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // 1. Verificación en diccionario local maestro (con tildes o normalizada)
        if (typeof messages !== 'undefined' && messages && messages[lang]) {
            const langDict = messages[lang];
            const checkDict = (dict) => {
                if (!dict) return null;
                return dict[rawKey] || dict[normKey] || dict[strVal] || null;
            };

            if (category && langDict.db && langDict.db[category]) {
                const found = checkDict(langDict.db[category]);
                if (found) return found;
            }
            if (category && langDict[category]) {
                const found = checkDict(langDict[category]);
                if (found) return found;
            }
            if (category === 'roles' && langDict.security_sec?.roles) {
                const found = checkDict(langDict.security_sec.roles);
                if (found) return found;
            }
            if (langDict.db?.verdicts) {
                const found = checkDict(langDict.db.verdicts);
                if (found) return found;
            }
            if (langDict.db?.types) {
                const found = checkDict(langDict.db.types);
                if (found) return found;
            }
            if (langDict.db?.measurements) {
                const found = checkDict(langDict.db.measurements);
                if (found) return found;
            }
            if (langDict.db?.catalogs) {
                const found = checkDict(langDict.db.catalogs);
                if (found) return found;
            }
            if (langDict.db?.roles) {
                const found = checkDict(langDict.db.roles);
                if (found) return found;
            }
            if (langDict.status) {
                const found = checkDict(langDict.status);
                if (found) return found;
            }
        }

        // Si el idioma es Español y no requirió traducción de diccionario, devolvemos el valor original
        if (lang === 'ES') return strVal;

        // No traducir códigos puramente numéricos o IDs técnicos cortos
        if (/^[0-9#\-_/.]+$/.test(strVal)) return strVal;

        // 2. Verificación en caché reactiva en cliente (pre-hidratada por CacheService)
        const cacheKey = lang + ':' + strVal;
        if (dynamicTranslationsCache[cacheKey]) {
            return dynamicTranslationsCache[cacheKey];
        }

        // 3. Fallback asíncrono en lote con CacheService + LanguageApp en servidor
        if (!pendingTranslations.has(cacheKey)) {
            pendingTranslations.add(cacheKey);
            if (!batchQueue.has(lang)) batchQueue.set(lang, new Set());
            batchQueue.get(lang).add(strVal);
            if (batchTimer) clearTimeout(batchTimer);
            batchTimer = setTimeout(flushTranslationBatch, 90);
        }

        return strVal;
    };

    const normalizeResult = (val) => {
        if (!val) return "";
        let s = String(val).trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        if (s === "CIMPLE" || s === "PASS" || s === "PASSED" || s === "OK" || s === "P") return "CUMPLE";
        if (s === "F" || s === "FAIL" || s === "FAILED" || s === "NO CUMPLE") return "FALLA";
        return String(val).trim();
    };

    const translateStatus = (statusStr) => {
        return translateDynamic(normalizeResult(statusStr), 'status');
    };

    const translateRole = (roleStr) => {
        return translateDynamic(roleStr, 'roles');
    };

    return {
        locale,
        availableLanguages,
        currentLanguage,
        showLangDropdown,
        dynamicTranslationsCache,
        hydrateTranslationCache,
        setLanguage,
        toggleLanguage,
        translateDynamic,
        translateStatus,
        translateRole,
        normalizeResult
    };
}
</script>
