<script>
/**
 * 🟢 COMPOSABLE: LÓGICA DEL ENCABEZADO Y TRADUCCIÓN DINÁMICA
 * Maneja el cambio de 4 idiomas (ES, EN, ZH, TH), persistencia,
 * traducciones de estados, mapeo de catálogos y fallback con LanguageApp / CacheService.
 */

// Caché reactivo global en cliente para traducciones dinámicas
const dynamicTranslationsCache = Vue.reactive({});
const pendingTranslations = new Set();

// Pre-cargar desde sessionStorage si existe
try {
    for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && k.startsWith('trans_')) {
            const cacheKey = k.substring(6);
            dynamicTranslationsCache[cacheKey] = sessionStorage.getItem(k);
        }
    }
} catch (e) {}

function useHeader() {
    // Hook de Vue-i18n en ámbito global
    const { locale } = VueI18n.useI18n({ useScope: 'global' });
    const showLangDropdown = Vue.ref(false);

    const availableLanguages = [
        { code: 'ES', name: 'Español', flag: '🇲🇽', label: 'ES' },
        { code: 'EN', name: 'English', flag: '🇺🇸', label: 'EN' },
        { code: 'ZH', name: '中文 (简体)', flag: '🇨🇳', label: 'ZH' },
        { code: 'TH', name: 'ภาษาไทย', flag: '🇹🇭', label: 'TH' }
    ];

    const currentLanguage = Vue.computed(() => {
        return availableLanguages.find(l => l.code === locale.value) || availableLanguages[0];
    });

    const setLanguage = (langCode) => {
        if (['ES', 'EN', 'ZH', 'TH'].includes(langCode)) {
            locale.value = langCode;
            try {
                localStorage.setItem('ESD_LANG', langCode);
            } catch (e) {
                console.warn('No se pudo guardar la preferencia de idioma en localStorage:', e);
            }
        }
        showLangDropdown.value = false;
    };

    const toggleLanguage = () => {
        const order = ['ES', 'EN', 'ZH', 'TH'];
        const nextIdx = (order.indexOf(locale.value) + 1) % order.length;
        setLanguage(order[nextIdx]);
    };

    /**
     * Traduce valores dinámicos (tipos, mediciones, catálogos, estados o texto libre).
     * 1. Consulta el diccionario local i18n según clave normalizada.
     * 2. Si no existe en el diccionario y el idioma != 'ES', consulta la caché dinámica reactiva.
     * 3. Si no está en caché, dispara llamada asíncrona a translateText en servidor (LanguageApp + CacheService).
     */
    const translateDynamic = (val, category = '') => {
        if (val === null || val === undefined || val === '') return '';
        const strVal = String(val).trim();
        if (!strVal) return '';

        const lang = locale.value || 'ES';
        const rawKey = strVal.toUpperCase().replace(/[\s\.\-]+/g, '_');
        const normKey = rawKey.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // 1. Verificación en diccionario local maestro (con tildes o normalizada)
        if (typeof messages !== 'undefined' && messages && messages[lang]) {
            const langDict = messages[lang];
            const checkDict = (dict) => {
                if (!dict) return null;
                return dict[rawKey] || dict[normKey] || null;
            };

            if (category && langDict.db && langDict.db[category]) {
                const found = checkDict(langDict.db[category]);
                if (found) return found;
            }
            if (category && langDict[category]) {
                const found = checkDict(langDict[category]);
                if (found) return found;
            }
            if (category === 'roles' && langDict.security_sec?.roles) {
                const found = checkDict(langDict.security_sec.roles);
                if (found) return found;
            }
            if (langDict.db?.types) {
                const found = checkDict(langDict.db.types);
                if (found) return found;
            }
            if (langDict.db?.measurements) {
                const found = checkDict(langDict.db.measurements);
                if (found) return found;
            }
            if (langDict.db?.catalogs) {
                const found = checkDict(langDict.db.catalogs);
                if (found) return found;
            }
            if (langDict.db?.roles) {
                const found = checkDict(langDict.db.roles);
                if (found) return found;
            }
            if (langDict.status) {
                const found = checkDict(langDict.status);
                if (found) return found;
            }
        }

        // Si el idioma es Español y no requirió traducción de diccionario, devolvemos el valor original
        if (lang === 'ES') return strVal;

        // 2. Verificación en caché reactiva en cliente
        const cacheKey = lang + ':' + strVal;
        if (dynamicTranslationsCache[cacheKey]) {
            return dynamicTranslationsCache[cacheKey];
        }

        // 3. Fallback asíncrono con LanguageApp en servidor
        if (!pendingTranslations.has(cacheKey)) {
            pendingTranslations.add(cacheKey);
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((res) => {
                        pendingTranslations.delete(cacheKey);
                        const translated = (res && typeof res === 'object' && res.translated) ? res.translated : (typeof res === 'string' ? res : null);
                        if (translated && typeof translated === 'string') {
                            dynamicTranslationsCache[cacheKey] = translated;
                            try {
                                sessionStorage.setItem('trans_' + cacheKey, translated);
                            } catch (e) {}
                        }
                    })
                    .withFailureHandler((err) => {
                        pendingTranslations.delete(cacheKey);
                        console.warn('Error al traducir texto libre "' + strVal + '":', err);
                    })
                    .translateText(strVal, lang.toLowerCase(), '');
            }
        }

        return strVal;
    };

    const normalizeResult = (val) => {
        if (!val) return "";
        let s = String(val).trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        if (s === "CIMPLE" || s === "PASS" || s === "PASSED" || s === "OK" || s === "P") return "CUMPLE";
        if (s === "F" || s === "FAIL" || s === "FAILED" || s === "NO CUMPLE") return "FALLA";
        return String(val).trim();
    };

    const translateStatus = (statusStr) => {
        return translateDynamic(normalizeResult(statusStr), 'status');
    };

    const translateRole = (roleStr) => {
        return translateDynamic(roleStr, 'roles');
    };

    return {
        locale,
        availableLanguages,
        currentLanguage,
        showLangDropdown,
        dynamicTranslationsCache,
        setLanguage,
        toggleLanguage,
        translateDynamic,
        translateStatus,
        translateRole,
        normalizeResult
    };
}
</script>
