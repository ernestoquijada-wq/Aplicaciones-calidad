<script>
/**
 * 🟢 COMPOSABLE: LÓGICA DE ADMINISTRACIÓN
 * Maneja Catálogos, Reglas, Estados, DataHub, Seguridad y Ajustes.
 */
function useAdmin(globalConfig) {
    const { ref, computed, nextTick, watch } = Vue;
    
    // Extraemos las dependencias y variables maestras del Main
    const { 
        runGAS, loadData, Swal, Toast, submitting, assets,
        catalogs, dbRules, statusDB, matrixDB, alertsDB, rolesDB, usersDB, 
        aiSettings, emailConfig, generalSettings, FIELD_MAP, ICONS, FrontendValidator,
        persistLocalStore, quadrantDB
    } = globalConfig;

    const statusSubTab = ref('statuses');
    const editingAlert = ref(false);
    const newAlertRule = ref({
        id: '',
        name: '',
        targetField: 'RESULTADO',
        triggerValues: '',
        bgColor: '#fee2e2',
        textColor: '#b91c1c',
        borderColor: '#fca5a5',
        icon: 'fa-exclamation-circle',
        pulse: false,
        showPrefix: true,
        active: true
    });

    // ==========================================
    // 1. ESTADO DE NAVEGACIÓN Y UI
    // ==========================================
    const adminTab = ref('catalogs');
    const activeCatalogCategory = ref('SECTOR');
    const editingCatalog = ref(false);
    const editingCatalogOriginalId = ref('');
    const newCatalog = ref({ category:'SECTOR', id:'', label:'', color:'#000000', config: { startRow: 8, columns: [], required: true, showOnOpen: true, showOnClose: false } });
    
    const newStatus = ref({ name:'', showCard: false, color: '#64748b', isAdmin: false, requiresMeasurements: true });
    const ruleModal = ref({ open:false, isEdit:false, data:{}, tempActive:{} });
    const editModal = ref({ open:false, oldValue:'', newValue:{ name:'', showCard: false, color: '#64748b', isAdmin: false, requiresMeasurements: true } });
    const iconSelectorOpen = ref(false);

    // ==========================================
    // 2. LÓGICA DE CATÁLOGOS (CRUD UNIVERSAL)
    // ==========================================
    const activeCatalogLabel = computed(() => {
        const catMap = { 
            'SECTOR': 'quadrants', 'FACTORY': 'factories', 'PROJECT': 'projects', 
            'AUDITOR': 'auditors', 'TEMPLATE': 'templates', 
            'TICKET_FIELD': 'ticketFields', 'EMAIL_GROUP': 'emailGroups',
            'AI_PROMPT': 'aiPersonalities' 
        };
        const subKey = catMap[activeCatalogCategory.value];
        if (typeof i18n !== 'undefined' && i18n?.global && subKey) {
            const _loc = i18n.global.locale.value;
            return i18n.global.t('admin.catalogs.' + subKey).toUpperCase();
        }
        const map = { 
            'SECTOR': 'CUADRANTES', 'FACTORY': 'FÁBRICAS', 'PROJECT': 'PROYECTOS', 
            'AUDITOR': 'RESPONSABLES', 'TEMPLATE': 'PLANTILLAS DE REPORTE', 
            'TICKET_FIELD': 'CAMPOS DE SEGUIMIENTO', 'EMAIL_GROUP': 'GRUPOS DE CORREO',
            'AI_PROMPT': 'PERSONALIDADES IA' 
        };
        return map[activeCatalogCategory.value] || 'ELEMENTOS';
    });

    const activeList = computed(() => {
        if(activeCatalogCategory.value === 'SECTOR') return catalogs.value.sectors;
        if(activeCatalogCategory.value === 'FACTORY') return catalogs.value.factories;
        if(activeCatalogCategory.value === 'PROJECT') return catalogs.value.projects;
        if(activeCatalogCategory.value === 'AUDITOR') return catalogs.value.auditors;
        if(activeCatalogCategory.value === 'TEMPLATE') return catalogs.value.templates || [];
        if(activeCatalogCategory.value === 'TICKET_FIELD') return catalogs.value.ticketFields || [];
        if(activeCatalogCategory.value === 'EMAIL_GROUP') return catalogs.value.emailGroups || [];
        if(activeCatalogCategory.value === 'AI_PROMPT') return catalogs.value.aiPrompts || []; 
        return [];
    });

    const getCatalogKey = (cat) => {
        const map = { 
            'SECTOR': 'sectors', 'FACTORY': 'factories', 'PROJECT': 'projects', 
            'AUDITOR': 'auditors', 'TEMPLATE': 'templates', 'TICKET_FIELD': 'ticketFields', 
            'EMAIL_GROUP': 'emailGroups', 'AI_PROMPT': 'aiPrompts' 
        };
        return map[cat] || 'sectors';
    };

    const saveCatalogItem = async () => { 
        if (submitting.value) return;
        
        const catId = FrontendValidator.sanitize(newCatalog.value.id);
        const catLabel = FrontendValidator.sanitize(newCatalog.value.label);
        
        if (FrontendValidator.isBlank(catId)) {
            return Swal.fire("Campo Obligatorio", "El ID del elemento es obligatorio.", "warning");
        }
        // Si es Fábrica, Proyecto o Auditor y no se especificó etiqueta, se toma el ID automáticamente
        if (['FACTORY', 'PROJECT', 'AUDITOR'].includes(activeCatalogCategory.value)) {
            if (FrontendValidator.isBlank(catLabel)) {
                catLabel = catId;
            }
        }
        
        if (FrontendValidator.isBlank(catLabel) && !['EMAIL_GROUP', 'FACTORY', 'PROJECT', 'AUDITOR'].includes(activeCatalogCategory.value)) {
            return Swal.fire("Campo Obligatorio", "La etiqueta/nombre del elemento es obligatoria.", "warning");
        }
        
        newCatalog.value.id = catId;
        newCatalog.value.label = catLabel;

        if (activeCatalogCategory.value === 'EMAIL_GROUP') {
            const validEmails = adminEmailGroupList.value
                .map(e => FrontendValidator.sanitize(e))
                .filter(e => !FrontendValidator.isBlank(e));
                
            if (validEmails.length === 0) {
                return Swal.fire("Error", "Debes ingresar al menos un correo para el grupo.", "warning");
            }
            for (const em of validEmails) {
                const fullEm = em.toLowerCase().includes('@') ? em.toLowerCase() : `${em.toLowerCase()}@plexus.com`;
                if (!FrontendValidator.isValidEmail(fullEm)) {
                    return Swal.fire("Correo Inválido", `"${em}" no es una dirección de correo válida.`, "warning");
                }
            }
            newCatalog.value.label = validEmails.map(e => {
                const em = e.toLowerCase().replace('@plexus.com', '');
                return `${em}@plexus.com`;
            }).join(', ');
        }

        const catKey = getCatalogKey(activeCatalogCategory.value);
        if (!catalogs.value[catKey]) catalogs.value[catKey] = [];
        const prevSnapshot = JSON.parse(JSON.stringify(catalogs.value[catKey]));
        const isEditing = editingCatalog.value;
        const origId = editingCatalogOriginalId.value;
        const itemToSave = JSON.parse(JSON.stringify(newCatalog.value));
        if (activeCatalogCategory.value === 'SECTOR') {
            itemToSave.hex = itemToSave.color || '#005565';
        }

        // 🚀 Renderizado Optimista (< 50ms): actualización inmediata de vista y caché
        if (isEditing) {
            const idx = catalogs.value[catKey].findIndex(x => String(x.id).toUpperCase() === String(origId).toUpperCase());
            if (idx !== -1) {
                catalogs.value[catKey][idx] = itemToSave;
            }
        } else {
            const exists = catalogs.value[catKey].some(x => String(x.id).toUpperCase() === String(itemToSave.id).toUpperCase());
            if (!exists) {
                catalogs.value[catKey].push(itemToSave);
            }
        }

        if (activeCatalogCategory.value === 'SECTOR') {
            quadrantDB.value = catalogs.value.sectors;
        }

        cancelCatalogEdit();
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: isEditing ? 'Elemento Actualizado' : 'Elemento Guardado' });

        // Persistencia asíncrona en segundo plano sin congelar la pantalla
        (async () => {
            try { 
                if(isEditing) {
                    const r = await runGAS('adminUpdateCatalogItem', activeCatalogCategory.value, origId, itemToSave);
                    if (r && r.success === false) throw new Error(r.error || 'Error al actualizar');
                } else {
                    const r = await runGAS('adminSaveConfigItem', itemToSave);
                    if (r && r.success === false) throw new Error(r.error || 'Error al guardar');
                }
            } catch(e) { 
                console.error("Rollback en catálogo:", e);
                catalogs.value[catKey] = prevSnapshot;
                if (activeCatalogCategory.value === 'SECTOR') quadrantDB.value = catalogs.value.sectors;
                if (persistLocalStore) persistLocalStore();
                Swal.fire("Error de Sincronización", e.message || 'No se pudo guardar en el servidor', "error"); 
            }
        })();
    };

    const editCatalog = (item) => {
        editingCatalog.value = true;
        editingCatalogOriginalId.value = item.id;
        const cfg = item.config || {};
        let c = item.hex || item.color || '';
        
        if ((activeCatalogCategory.value === 'TEMPLATE' || activeCatalogCategory.value === 'TICKET_FIELD') && c.startsWith('#')) {
            c = c.substring(1);
        } else if (!c) {
            c = '#000000';
        }

        if (activeCatalogCategory.value === 'EMAIL_GROUP') {
            if (item.label) adminEmailGroupList.value = item.label.split(',').map(e => e.trim().replace('@plexus.com', ''));
            else adminEmailGroupList.value = [''];
        }

        newCatalog.value = { 
            category: activeCatalogCategory.value, id: item.id, label: item.label, color: c, 
            config: { 
                startRow: cfg.startRow || 8, columns: cfg.columns || [], 
                required: cfg.required !== false, showOnOpen: cfg.showOnOpen !== false, showOnClose: cfg.showOnClose === true,
                modules: cfg.modules || [], allowedRoles: cfg.allowedRoles || []
            } 
        };
    };

    const cancelCatalogEdit = () => {
        editingCatalog.value = false;
        adminEmailGroupList.value = ['']; 
        newCatalog.value={category:activeCatalogCategory.value, id:'', label:'', color:'#000000', config: { startRow: 8, columns: [], required: true, showOnOpen: true, showOnClose: false }};
    };

    const moveColUp = (i) => {
        if (i <= 0 || !newCatalog.value?.config?.columns) return;
        const cols = newCatalog.value.config.columns;
        const temp = cols[i];
        cols[i] = cols[i - 1];
        cols[i - 1] = temp;
    };

    const moveColDown = (i) => {
        if (!newCatalog.value?.config?.columns || i >= newCatalog.value.config.columns.length - 1) return;
        const cols = newCatalog.value.config.columns;
        const temp = cols[i];
        cols[i] = cols[i + 1];
        cols[i + 1] = temp;
    };

    const previewTemplate = async () => {
        if (!newCatalog.value.config?.columns || newCatalog.value.config.columns.length === 0) {
            return Swal.fire("Sin columnas", "Agrega al menos una columna para generar la vista previa.", "warning");
        }
        submitting.value = true;
        try {
            Toast.fire({ icon: 'info', title: 'Generando vista previa...' });
            const r = await runGAS('adminGenerateFullReport', [], JSON.parse(JSON.stringify(newCatalog.value)), true);
            if (r.success) {
                window.open(r.url, '_blank');
                Toast.fire({ icon: 'success', title: 'Vista previa abierta' });
            } else {
                throw new Error(r.error);
            }
        } catch (e) {
            Swal.fire("Error", e.message, "error");
        } finally {
            submitting.value = false;
        }
    };

    const deleteCatalogItem = (cat, id) => { 
        Swal.fire({
            title: '¿Estás seguro?', text: "No podrás revertir esto", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#005565', confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const catKey = getCatalogKey(cat);
                if (!catalogs.value[catKey]) return;
                const prevSnapshot = JSON.parse(JSON.stringify(catalogs.value[catKey]));

                // 🚀 Renderizado Optimista (< 50ms)
                catalogs.value[catKey] = catalogs.value[catKey].filter(x => String(x.id).toUpperCase() !== String(id).toUpperCase());
                if (cat === 'SECTOR') quadrantDB.value = catalogs.value.sectors;
                if (persistLocalStore) persistLocalStore();
                Toast.fire({ icon: 'success', title: 'Elemento Eliminado' });

                try {
                    const r = await runGAS('adminDeleteConfigItem', cat, id);
                    if (r && r.success === false) throw new Error(r.error || 'Error al eliminar');
                } catch(e) {
                    console.error("Rollback en eliminar catálogo:", e);
                    catalogs.value[catKey] = prevSnapshot;
                    if (cat === 'SECTOR') quadrantDB.value = catalogs.value.sectors;
                    if (persistLocalStore) persistLocalStore();
                    Swal.fire("Error de Sincronización", e.message || 'Error al eliminar en el servidor', "error");
                }
            }
        });
    };

    // ==========================================
    // 3. LÓGICA DE ESTADOS Y MATRIZ
    // ==========================================
    const addStatus = async () => { 
        if (submitting.value) return;
        const statusName = FrontendValidator.sanitize(newStatus.value.name).toUpperCase();
        if (FrontendValidator.isBlank(statusName)) {
            return Swal.fire("Campo Requerido", "El nombre del estado es obligatorio.", "warning");
        }
        
        // Verificar duplicados en la lista de estados
        const exists = statusDB.value.some(s => s.name.toUpperCase().trim() === statusName);
        if (exists) {
            return Swal.fire("Estado Duplicado", `El estado "${statusName}" ya existe en el sistema.`, "warning");
        }

        const newObj = { name: statusName, showCard: !!newStatus.value.showCard, color: newStatus.value.color || '#64748b', isAdmin: !!newStatus.value.isAdmin, requiresMeasurements: newStatus.value.requiresMeasurements !== false };
        if (!matrixDB.value.validationReasons) matrixDB.value.validationReasons = [];
        const prevReasons = JSON.parse(JSON.stringify(matrixDB.value.validationReasons));

        // 🚀 Renderizado Optimista (< 50ms)
        matrixDB.value.validationReasons.push(newObj);
        newStatus.value = { name: '', showCard: false, color: '#64748b', isAdmin: false, requiresMeasurements: true };
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Estado Agregado' });

        try { 
            const r = await runGAS('adminAddMatrixOption', newObj); 
            if (r && r.success === false) throw new Error(r.error || 'Error al agregar estado');
        } catch(e) { 
            console.error("Rollback en agregar estado:", e);
            matrixDB.value.validationReasons = prevReasons;
            if (persistLocalStore) persistLocalStore();
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error"); 
        }
    };

    const deleteStatus = (idx) => { 
        Swal.fire({ title: '¿Eliminar estado?', text: "Esta acción es irreversible", icon: 'warning', showCancelButton: true, confirmButtonColor: '#005565', confirmButtonText: 'Sí, eliminar' }).then(async (result) => {
            if(result.isConfirmed) {
                const targetName = statusDB.value[idx]?.name;
                if (!targetName) return;
                const prevReasons = JSON.parse(JSON.stringify(matrixDB.value.validationReasons || []));

                // 🚀 Renderizado Optimista (< 50ms)
                matrixDB.value.validationReasons = matrixDB.value.validationReasons.filter(s => {
                    const sName = typeof s === 'string' ? s : s.name;
                    return String(sName).toUpperCase() !== String(targetName).toUpperCase();
                });
                if (persistLocalStore) persistLocalStore();
                Toast.fire({ icon: 'success', title: 'Estado Eliminado' });

                try { 
                    const r = await runGAS('adminDeleteMatrixOption', targetName); 
                    if (r && r.success === false) throw new Error(r.error || 'Error al eliminar');
                } catch(e) { 
                    console.error("Rollback en eliminar estado:", e);
                    matrixDB.value.validationReasons = prevReasons;
                    if (persistLocalStore) persistLocalStore();
                    Swal.fire("Error de Sincronización", e.message, "error"); 
                }
            }
        });
    };

    const openEditStateModal = (sObj) => {
        const clone = JSON.parse(JSON.stringify(sObj));
        if (clone.requiresMeasurements === undefined) {
            clone.requiresMeasurements = !['BAJA', 'SCRAP', 'OBSOLETO', 'DESINCORPORADO'].includes(String(clone.name || '').toUpperCase().trim());
        } else {
            clone.requiresMeasurements = clone.requiresMeasurements === true || String(clone.requiresMeasurements).toLowerCase() === 'true';
        }
        editModal.value = { open: true, oldValue: sObj.name, newValue: clone };
    };

    const confirmStateUpdate = async () => { 
        if (submitting.value) return;
        const newName = FrontendValidator.sanitize(editModal.value.newValue.name).toUpperCase();
        if (FrontendValidator.isBlank(newName)) {
            return Swal.fire("Campo Requerido", "El nombre del estado no puede estar vacío.", "warning");
        }
        editModal.value.newValue.name = newName;
        editModal.value.newValue.requiresMeasurements = editModal.value.newValue.requiresMeasurements !== false;
        const oldName = editModal.value.oldValue;
        const updatedObj = JSON.parse(JSON.stringify(editModal.value.newValue));
        const prevReasons = JSON.parse(JSON.stringify(matrixDB.value.validationReasons || []));

        // 🚀 Renderizado Optimista (< 50ms)
        const idx = matrixDB.value.validationReasons.findIndex(s => {
            const sName = typeof s === 'string' ? s : s.name;
            return String(sName).toUpperCase() === String(oldName).toUpperCase();
        });
        if (idx !== -1) {
            matrixDB.value.validationReasons[idx] = updatedObj;
        }
        editModal.value.open = false;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Estado Actualizado' });

        try { 
            const r = await runGAS('adminUpdateMatrixOption', oldName, updatedObj); 
            if (r && r.success === false) throw new Error(r.error || 'Error al actualizar estado');
        } catch(e) { 
            console.error("Rollback en actualizar estado:", e);
            matrixDB.value.validationReasons = prevReasons;
            if (persistLocalStore) persistLocalStore();
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error"); 
        }
    };

    // ==========================================
    // 🚨 GESTIÓN DE REGLAS DE ALERTAS DINÁMICAS
    // ==========================================
    const saveAlertRule = async () => {
        if (submitting.value) return;
        const name = FrontendValidator.sanitize(newAlertRule.value.name).toUpperCase();
        if (FrontendValidator.isBlank(name)) {
            return Swal.fire("Campo Requerido", "El nombre de la alerta es obligatorio.", "warning");
        }

        const isEditing = editingAlert.value;
        const payload = {
            id: newAlertRule.value.id || ('ALERT_' + Date.now()),
            name: name,
            targetField: newAlertRule.value.targetField || 'RESULTADO',
            triggerValues: FrontendValidator.sanitize(newAlertRule.value.triggerValues).toUpperCase(),
            bgColor: newAlertRule.value.bgColor || '#fee2e2',
            textColor: newAlertRule.value.textColor || '#b91c1c',
            borderColor: newAlertRule.value.borderColor || '#fca5a5',
            icon: newAlertRule.value.icon || 'fa-exclamation-circle',
            pulse: !!newAlertRule.value.pulse,
            showPrefix: newAlertRule.value.showPrefix !== false,
            active: newAlertRule.value.active !== false
        };

        if (!alertsDB.value) alertsDB.value = [];
        const prevAlerts = JSON.parse(JSON.stringify(alertsDB.value));

        // 🚀 Optimistic UI Update (<50ms)
        if (isEditing) {
            const idx = alertsDB.value.findIndex(a => a.id === payload.id);
            if (idx !== -1) alertsDB.value[idx] = payload;
        } else {
            alertsDB.value.push(payload);
        }

        editingAlert.value = false;
        newAlertRule.value = {
            id: '', name: '', targetField: 'RESULTADO', triggerValues: '',
            bgColor: '#fee2e2', textColor: '#b91c1c', borderColor: '#fca5a5',
            icon: 'fa-exclamation-circle', pulse: false, showPrefix: true, active: true
        };
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: isEditing ? 'Alerta Actualizada' : 'Alerta Creada' });

        try {
            submitting.value = true;
            const r = isEditing 
                ? await runGAS('adminUpdateAlertRule', payload.id, payload)
                : await runGAS('adminSaveAlertRule', payload);

            if (r && r.success === false) throw new Error(r.error || 'Error al guardar');
        } catch (e) {
            console.error("Rollback en alerta:", e);
            alertsDB.value = prevAlerts;
            if (persistLocalStore) persistLocalStore();
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        } finally {
            submitting.value = false;
        }
    };

    const editAlertRule = (rule) => {
        editingAlert.value = true;
        newAlertRule.value = JSON.parse(JSON.stringify(rule));
    };

    const cancelAlertEdit = () => {
        editingAlert.value = false;
        newAlertRule.value = {
            id: '', name: '', targetField: 'RESULTADO', triggerValues: '',
            bgColor: '#fee2e2', textColor: '#b91c1c', borderColor: '#fca5a5',
            icon: 'fa-exclamation-circle', pulse: false, showPrefix: true, active: true
        };
    };

    const deleteAlertRule = (id) => {
        Swal.fire({
            title: '¿Eliminar regla de alerta?',
            text: 'Esta alerta ya no se evaluará en las tarjetas de resultados.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e11d48',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const prevAlerts = JSON.parse(JSON.stringify(alertsDB.value || []));
                alertsDB.value = (alertsDB.value || []).filter(a => a.id !== id);
                if (persistLocalStore) persistLocalStore();
                Toast.fire({ icon: 'success', title: 'Regla de Alerta Eliminada' });

                try {
                    const r = await runGAS('adminDeleteAlertRule', id);
                    if (r && r.success === false) throw new Error(r.error || 'Error al eliminar');
                } catch (e) {
                    alertsDB.value = prevAlerts;
                    if (persistLocalStore) persistLocalStore();
                    Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
                }
            }
        });
    };

    const toggleAlertRule = async (rule) => {
        const nextState = !rule.active;
        const prevAlerts = JSON.parse(JSON.stringify(alertsDB.value || []));
        rule.active = nextState;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'info', title: nextState ? 'Alerta Habilitada' : 'Alerta Deshabilitada' });

        try {
            const r = await runGAS('adminToggleAlertRule', rule.id, nextState);
            if (r && r.success === false) throw new Error(r.error || 'Error al alternar');
        } catch (e) {
            alertsDB.value = prevAlerts;
            if (persistLocalStore) persistLocalStore();
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        }
    };

    // ==========================================
    // 4. LÓGICA DE REGLAS (ESD TOLERANCES)
    // ==========================================
    const openRuleModal = (key, rule) => { 
        ruleModal.value.open=true;
        ruleModal.value.tempActive={}; 
        if(key) { 
            ruleModal.value.isEdit=true;
            ruleModal.value.data = JSON.parse(JSON.stringify(rule));
            if(!ruleModal.value.data.recs) ruleModal.value.data.recs = {};
            ruleModal.value.data.description = key;
            for(const k in FIELD_MAP) { 
                if(rule[k]) { 
                    ruleModal.value.tempActive[k] = true;
                    if(FIELD_MAP[k].type === 'scientific') { try { const parts = String(rule[k]).toUpperCase().replace('<','').trim().split('E'); ruleModal.value.data[k + '_m'] = parts[0]; ruleModal.value.data[k + '_e'] = parts[1].replace('+',''); } catch(e) {} } 
                } 
            } 
        } else { 
            ruleModal.value.isEdit=false;
            const cleanData = { defaultIcon:'fa-box', recommendation:'', tolerance:0.8, recs:{} };
            for(const k in FIELD_MAP) { cleanData[k] = ''; cleanData[k+'_m'] = ''; cleanData[k+'_e'] = ''; cleanData.recs[k] = ''; }
            ruleModal.value.data = cleanData;
        } 
    };

    const deleteRule = (ruleId) => {
         Swal.fire({ title: '¿Eliminar Regla?', text: "Esto afectará la creación de nuevos activos de este tipo.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'Sí, eliminar permanentemente' })
         .then(async (result) => {
            if (result.isConfirmed) {
                const prevRule = dbRules.value[ruleId] ? JSON.parse(JSON.stringify(dbRules.value[ruleId])) : null;

                // 🚀 Renderizado Optimista (< 50ms)
                delete dbRules.value[ruleId];
                if (persistLocalStore) persistLocalStore();
                Toast.fire({ icon: 'success', title: 'Regla Eliminada' });

                try { 
                    const r = await runGAS('adminDeleteRule', ruleId); 
                    if (r && r.success === false) throw new Error(r.error || 'Error al eliminar regla');
                } catch(e) { 
                    console.error("Rollback en eliminar regla:", e);
                    if (prevRule) dbRules.value[ruleId] = prevRule;
                    if (persistLocalStore) persistLocalStore();
                    Swal.fire("Error de Sincronización", e.message, "error"); 
                }
            }
        });
    };

    const saveRule = async () => { 
        if (submitting.value) return;
        const ruleDesc = FrontendValidator.sanitize(ruleModal.value.data.description).toUpperCase();
        if (FrontendValidator.isBlank(ruleDesc)) {
            return Swal.fire("Campo Requerido", "El tipo de activo es obligatorio.", "warning");
        }
        ruleModal.value.data.description = ruleDesc;
        ruleModal.value.data.recommendation = FrontendValidator.sanitize(ruleModal.value.data.recommendation);

        const p = { 
            description: ruleDesc, 
            defaultIcon: ruleModal.value.data.defaultIcon || 'fa-box', 
            recommendation: ruleModal.value.data.recommendation || '', 
            tolerance: ruleModal.value.data.tolerance ?? 0.8, 
            recs: ruleModal.value.data.recs || {} 
        }; 
        for(const k in FIELD_MAP) { 
            if(ruleModal.value.tempActive[k]) { 
                if(FIELD_MAP[k].type === 'scientific') { 
                    const m = ruleModal.value.data[k + '_m'] || '1.0'; 
                    const e = ruleModal.value.data[k + '_e'] || '9'; 
                    p[k] = `< ${m}E${e}`; 
                } else { 
                    p[k] = ruleModal.value.data[k] || ''; 
                } 
            } else { 
                p[k] = ""; 
            } 
        }

        const prevRule = dbRules.value[ruleDesc] ? JSON.parse(JSON.stringify(dbRules.value[ruleDesc])) : null;

        // 🚀 Renderizado Optimista (< 50ms)
        dbRules.value[ruleDesc] = p;
        ruleModal.value.open = false;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Regla Guardada' });

        try { 
            const r = await runGAS('adminSaveRule', p); 
            if (r && r.success === false) throw new Error(r.error || 'Error al guardar regla');
        } catch(e) { 
            console.error("Rollback en guardar regla:", e);
            if (prevRule) dbRules.value[ruleDesc] = prevRule;
            else delete dbRules.value[ruleDesc];
            if (persistLocalStore) persistLocalStore();
            Swal.fire('Error de Sincronización', e.message || 'Error en el servidor', 'error'); 
        }
    };

    const getActiveMeasurements = (rule) => {
        if (!rule) return [];
        const list = [];
        for (const k in FIELD_MAP) {
            if (rule[k] && rule[k] !== 'N/A') {
                list.push(FIELD_MAP[k]?.label || k);
            }
        }
        return list;
    };

    // ==========================================
    // 5. DATA HUB (IMPORTACIÓN MASIVA)
    // ==========================================
    const showDataHubModal = ref(false);
    const bulkDataPreview = ref([]);
    const bulkStats = ref({ total: 0, nuevos: 0, duplicados: 0 });
    const isProcessingBulk = ref(false);
    const importTarget = ref('ASSETS');
    const importMethod = ref('CSV');
    const googleSheetUrl = ref('');

    const downloadTemplate = () => {
       let csvContent = "";
       if (importTarget.value === 'ASSETS') {
           csvContent = "CONTROL_NO,CUADRANTE,COLOR_CODE,DESCRIPCION,PROYECTO,FABRICA,ESTADO_ACTUAL,RESPONSABLE,COMENTARIOS\n";
           csvContent += "EJ-0001,A1,#005565,MESA ESD,PROYECTO X,PLANTA 1,ACTIVO,JUAN PEREZ,Borra este ejemplo antes de subir.\n";
       } else if (importTarget.value === 'USERS') {
           csvContent = "CORREO_ELECTRONICO,ROL_ASIGNADO\n";
           csvContent += "nuevo.auditor@plexus.com,AUDITOR\n";
       } else if (importTarget.value === 'RULES') {
           csvContent = "TIPO_ACTIVO_ID,TOLERANCIA,REC_GENERAL,SURFACE_MANTISSA,SURFACE_EXPONENTE,FLOORMAT_MANTISSA,FLOORMAT_EXPONENTE,ELEC_RES,IMPEDANCE,VOLTAGE,JACK\n";
           csvContent += "MESA_NUEVA,0.8,Limpiar superficie,1.0,9,1.0,9,N/A,N/A,N/A,N/A\n";
       }
       const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
       const link = document.createElement("a");
       link.setAttribute("href", URL.createObjectURL(blob));
       link.setAttribute("download", `Plantilla_Plexus_${importTarget.value}.csv`);
       document.body.appendChild(link); link.click(); document.body.removeChild(link);
       Toast.fire({ icon: 'success', title: 'Plantilla descargada' });
    };

    const createGoogleSheetTemplate = async () => {
      submitting.value = true;
      try {
        const templateLists = {
          roles: Object.keys(rolesDB.value), sectors: catalogs.value.sectors.map(s => s.id),
          factories: catalogs.value.factories.map(f => f.id), projects: catalogs.value.projects.map(p => p.id),
          auditors: catalogs.value.auditors.map(a => a.id), statuses: statusDB.value.map(s => s.name),
          types: Object.keys(dbRules.value)
        };
        const r = await runGAS('adminCreateSheetTemplate', importTarget.value, templateLists);
        if (r.success) { window.open(r.url, '_blank'); Toast.fire({ icon: 'success', title: 'Plantilla Inteligente Abierta' }); } 
        else throw new Error(r.error);
      } catch (e) { Swal.fire("Error al crear hoja", e.message, "error"); } finally { submitting.value = false; }
    };

    const processRawBulkData = (dataRows) => {
      let parsed = [], n = 0, d = 0;
      dataRows.forEach(row => {
        let id = '';
        if (importTarget.value === 'ASSETS') id = row['CONTROL_NO'] || row['ID'] || '';
        else if (importTarget.value === 'USERS') id = row['CORREO_ELECTRONICO'] || row['EMAIL'] || '';
        else if (importTarget.value === 'RULES') id = row['TIPO_ACTIVO_ID'] || '';

        if (!id) return;

        let existe = false;
        if (importTarget.value === 'ASSETS') existe = assets.value.some(a => String(a.controlNo).trim().toUpperCase() === String(id).trim().toUpperCase());
        else if (importTarget.value === 'USERS') existe = !!usersDB.value[String(id).toLowerCase().trim()];
        else if (importTarget.value === 'RULES') existe = !!dbRules.value[String(id).toUpperCase().trim()];

        if (existe) d++; else n++;
        parsed.push({ ...row, _isDuplicate: existe });
      });
      
      if (parsed.length === 0 && dataRows.length > 0) return Swal.fire("Encabezados Incorrectos", "El archivo no coincide con el módulo seleccionado.", "error");

      bulkDataPreview.value = parsed;
      bulkStats.value = { total: parsed.length, nuevos: n, duplicados: d };
    };

    const loadFromGoogleSheets = async () => {
      if(!googleSheetUrl.value.includes('docs.google.com/spreadsheets')) return Swal.fire('Error', 'URL de Google Sheets no válida.', 'warning');
      isProcessingBulk.value = true;
      try {
        const r = await runGAS('adminFetchExternalData', googleSheetUrl.value);
        if (r.success) { processRawBulkData(r.data); Toast.fire({ icon: 'success', title: 'Datos sincronizados de la nube' }); } 
        else throw new Error(r.error);
      } catch (e) { Swal.fire("Error", e.message, "error"); } finally { isProcessingBulk.value = false; }
    };

    const handleCSVUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      isProcessingBulk.value = true;
      const reader = new FileReader();
      reader.onload = (e) => {
        const lines = e.target.result.split('\n').filter(l => l.trim() !== '');
        if (lines.length < 2) { Swal.fire('Error', 'Archivo inválido', 'error'); isProcessingBulk.value = false; return; }
        const headers = lines[0].split(',').map(h => h.trim().toUpperCase());
        let parsed = [], n = 0, d = 0;
        for (let i = 1; i < lines.length; i++) {
          const row = lines[i].split(',').map(c => c.trim());
          let obj = {};
          headers.forEach((h, idx) => { obj[h] = row[idx] || ''; });
          const id = obj['ID'] || obj['CONTROL NO'] || '';
          const existe = assets.value.some(a => String(a.controlNo) === String(id));
          if (existe) d++; else n++;
          parsed.push({ ...obj, _isDuplicate: existe });
        }
        bulkDataPreview.value = parsed;
        bulkStats.value = { total: parsed.length, nuevos: n, duplicados: d };
        isProcessingBulk.value = false; event.target.value = null;
      };
      reader.readAsText(file);
    };

    const executeBulkAction = async (onlyNew) => {
      const dataToShip = bulkDataPreview.value.filter(r => onlyNew ? !r._isDuplicate : r._isDuplicate);
      if (dataToShip.length === 0) return;

      const confirm = await Swal.fire({ title: 'Confirmar Acción Masiva', text: onlyNew ? `¿Inyectar ${dataToShip.length} registros nuevos?` : `¿Actualizar ${dataToShip.length} registros existentes?`, icon: 'question', showCancelButton: true, confirmButtonColor: '#005565' });
      if (!confirm.isConfirmed) return;

      submitting.value = true;
      try {
        const r = await runGAS('adminBulkProcess', importTarget.value, dataToShip, !onlyNew);
        if (r.success) { Swal.fire("Éxito", "Operación masiva completada correctamente.", "success"); clearDataHub(); await loadData(); } 
        else throw new Error(r.error);
      } catch (e) { Swal.fire("Error", e.message, "error"); } finally { submitting.value = false; }
    };

    const clearDataHub = () => { bulkDataPreview.value = []; bulkStats.value = { total: 0, nuevos: 0, duplicados: 0 }; };

    // ==========================================
    // 6. AJUSTES VARIOS (CONFIGURACIÓN, SEGURIDAD, EMAIL, IA)
    // ==========================================
    const activeEmailType = ref('OPEN');
    const adminEmailGroupList = ref(['']);
    const lastFocusedEmailField = ref('body');

    watch(() => emailConfig.value, (val) => {
        if (val && !Array.isArray(val.factoryRules)) {
            val.factoryRules = [];
        }
    }, { immediate: true });

    const insertEmailTag = (tag) => {
        if (!emailConfig.value || !emailConfig.value[activeEmailType.value]) return;
        const targetField = lastFocusedEmailField.value === 'subject' ? 'subject' : 'body';
        const currentVal = emailConfig.value[activeEmailType.value][targetField] || '';
        emailConfig.value[activeEmailType.value][targetField] = currentVal ? (currentVal + ' ' + tag) : tag;
    };

    const addFactoryEmailRule = () => {
        if (!emailConfig.value) return;
        if (!Array.isArray(emailConfig.value.factoryRules)) {
            emailConfig.value.factoryRules = [];
        }
        emailConfig.value.factoryRules.push({ factory: '', email: '' });
    };

    const removeFactoryEmailRule = (idx) => {
        if (emailConfig.value && Array.isArray(emailConfig.value.factoryRules)) {
            emailConfig.value.factoryRules.splice(idx, 1);
        }
    };

    const interpolateEmailTemplate = (templateStr) => {
        if (!templateStr) return '';
        const sampleData = {
            '{{ID_ACTIVO}}': '3075',
            '{{DESCRIPCION}}': 'ESTACION TRABAJO SMT-04',
            '{{FABRICA}}': 'FAB 3',
            '{{PROYECTO}}': 'AUTOMOTIVE',
            '{{CUADRANTE}}': 'C-12',
            '{{FOLIO_TICKET}}': 'TCK-9901',
            '{{RESPONSABLE}}': 'juan.perez@plexus.com',
            '{{FECHA}}': new Date().toISOString().split('T')[0],
            '{{ESTADO}}': activeEmailType.value === 'OPEN' ? 'FALLA' : (activeEmailType.value === 'CLOSE' ? 'CUMPLE' : 'ALERTA CALIDAD')
        };
        let res = templateStr;
        Object.keys(sampleData).forEach(tag => {
            res = res.split(tag).join(sampleData[tag]);
        });
        return res;
    };

    const previewEmailSubject = computed(() => {
        const raw = emailConfig.value?.[activeEmailType.value]?.subject || '';
        return interpolateEmailTemplate(raw);
    });

    const previewEmailBody = computed(() => {
        const raw = emailConfig.value?.[activeEmailType.value]?.body || '';
        return interpolateEmailTemplate(raw);
    });
    
    const addAdminEmailField = async () => { 
        if (adminEmailGroupList.value[adminEmailGroupList.value.length - 1] !== '') {
            adminEmailGroupList.value.push('');
            await nextTick(); 
            const inputs = document.querySelectorAll('.admin-email-input');
            if (inputs.length > 0) inputs[inputs.length - 1].focus();
        } 
    };
    const removeAdminEmailField = (idx) => adminEmailGroupList.value.splice(idx, 1);

    const saveGeneralSettings = async () => {
        if (submitting.value) return;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Preferencia actualizada' });
        submitting.value = true;
        try {
            const r = await runGAS('adminSaveGeneralSettings', JSON.parse(JSON.stringify(generalSettings.value)));
            if (!r || !r.success) {
                throw new Error(r?.error || 'Error al guardar');
            }
        } catch(e) {
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        } finally {
            submitting.value = false;
        }
    };

    const saveEmailConfig = async () => {
        if (submitting.value) return;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Configuración guardada' });
        submitting.value = true;
        try {
            const r = await runGAS('adminSaveEmailConfig', JSON.parse(JSON.stringify(emailConfig.value)));
            if (!r || !r.success) {
                throw new Error(r?.error || 'Error al guardar');
            }
        } catch(e) {
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        } finally {
            submitting.value = false;
        }
    };

    const saveAiConfig = async () => {
        if (submitting.value) return;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Cerebro IA Actualizado' });
        submitting.value = true;
        try { 
            const r = await runGAS('adminSaveAiConfig', JSON.parse(JSON.stringify(aiSettings.value))); 
            if (!r || !r.success) throw new Error(r?.error || 'Error al actualizar IA'); 
        } catch(e) { 
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error"); 
        } finally { 
            submitting.value = false; 
        }
    };

    const newUserEmail = ref('');
    const newUserRole = ref('INVITADO');

    const addNewRole = async () => {
        const { value: name } = await Swal.fire({ title: 'Nuevo Rol', input: 'text', inputPlaceholder: 'Ej: GERENCIA' });
        const cleanName = FrontendValidator.sanitize(name).toUpperCase().replace(/\s+/g, '_');
        if (!FrontendValidator.isBlank(cleanName)) {
            if (rolesDB.value[cleanName]) {
                return Swal.fire("Rol Existente", `El rol "${cleanName}" ya existe.`, "warning");
            }
            rolesDB.value[cleanName] = { canView: true, canAudit: false, canConfig: false, canUsers: false, canUseCopilot: false };
            Toast.fire({ icon: 'info', title: 'Rol agregado (Guarda para aplicar)' });
        }
    };
    const deleteRole = (role) => { delete rolesDB.value[role]; };
    
    const saveRoles = async () => { 
        if (submitting.value) return;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Roles guardados' });
        submitting.value = true; 
        try {
            const r = await runGAS('adminSaveRoles', JSON.parse(JSON.stringify(rolesDB.value)));
            if (!r || !r.success) {
                throw new Error(r?.error || 'Error al guardar');
            }
        } catch(e) {
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        } finally {
            submitting.value = false;
        }
    };
        
    const addUser = () => { 
        const email = FrontendValidator.sanitize(newUserEmail.value).toLowerCase();
        if (FrontendValidator.isBlank(email)) {
            return Swal.fire("Campo Requerido", "Ingresa una dirección de correo.", "warning");
        }
        if (!FrontendValidator.isValidEmail(email)) {
            return Swal.fire("Correo Inválido", `"${email}" no es una dirección de correo válida.`, "warning");
        }
        usersDB.value[email] = newUserRole.value; 
        newUserEmail.value = ''; 
        Toast.fire({ icon: 'info', title: 'Usuario agregado a la lista (Guarda para aplicar)' });
    };
    
    const deleteUser = (email) => { delete usersDB.value[email]; };
    
    const openEditUser = async (email, currentRole) => {
        const roleOptions = {};
        Object.keys(rolesDB.value).forEach(r => {
            const translated = (typeof translateRole === 'function' ? translateRole(r) : r);
            roleOptions[r] = translated !== r ? `${translated} (${r})` : r;
        });
        const titleText = (window.$t ? window.$t('admin.security_sec.edit_user_title') : 'Editar Rol de Usuario');
        const saveText = (window.$t ? window.$t('common.save') : 'Guardar');
        const cancelText = (window.$t ? window.$t('common.cancel') : 'Cancelar');
        
        const { value: selectedRole } = await Swal.fire({
            title: titleText,
            html: `<p class="text-xs text-slate-500 mb-2 font-mono font-bold">${email}</p>`,
            input: 'select',
            inputOptions: roleOptions,
            inputValue: currentRole,
            showCancelButton: true,
            confirmButtonColor: '#005565',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: `<i class="fas fa-save mr-1"></i> ${saveText}`,
            cancelButtonText: cancelText
        });
        
        if (selectedRole && selectedRole !== currentRole) {
            await updateUserRole(email, selectedRole);
        }
    };

    const updateUserRole = async (email, newRole) => {
        if (!email || !newRole) return;
        const previousRole = usersDB.value[email];
        usersDB.value[email] = newRole;
        if (persistLocalStore) persistLocalStore();
        
        Toast.fire({ 
            icon: 'info', 
            title: (window.$t ? window.$t('admin.security_sec.saving_user') : 'Guardando...') 
        });
        
        try {
            const r = await runGAS('adminUpdateUserRole', { email, newRole });
            if (!r || !r.success) {
                throw new Error(r?.error || 'Error al actualizar');
            }
            Toast.fire({ 
                icon: 'success', 
                title: (window.$t ? window.$t('admin.security_sec.user_updated') : 'Rol actualizado correctamente') 
            });
        } catch(e) {
            usersDB.value[email] = previousRole;
            if (persistLocalStore) persistLocalStore();
            Swal.fire("Error", e.message || 'No se pudo actualizar el rol', "error");
        }
    };
    
    const saveUsers = async () => { 
        if (submitting.value) return;
        if (persistLocalStore) persistLocalStore();
        Toast.fire({ icon: 'success', title: 'Usuarios guardados' });
        submitting.value = true; 
        try {
            const r = await runGAS('adminSaveUsers', JSON.parse(JSON.stringify(usersDB.value)));
            if (!r || !r.success) {
                throw new Error(r?.error || 'Error al guardar');
            }
        } catch(e) {
            Swal.fire("Error de Sincronización", e.message || 'Error en el servidor', "error");
        } finally {
            submitting.value = false;
        }
    };

    // EXPORTAMOS TODO AL MAIN
    return {
        adminTab, activeCatalogCategory, activeCatalogLabel, activeList, editingCatalog, newCatalog, adminEmailGroupList, newStatus,
        statusSubTab, editingAlert, newAlertRule, alertsDB,
        ruleModal, editModal, iconSelectorOpen, iconsList: ICONS, fieldsConfig: FIELD_MAP,
        showDataHubModal, bulkDataPreview, bulkStats, isProcessingBulk, importTarget, importMethod, googleSheetUrl,
        activeEmailType, newUserEmail, newUserRole,
        lastFocusedEmailField, insertEmailTag, addFactoryEmailRule, removeFactoryEmailRule,
        previewEmailSubject, previewEmailBody,
        
        saveCatalogItem, editCatalog, cancelCatalogEdit, deleteCatalogItem, moveColUp, moveColDown, previewTemplate,
        addStatus, deleteStatus, openEditStateModal, confirmStateUpdate,
        saveAlertRule, editAlertRule, cancelAlertEdit, deleteAlertRule, toggleAlertRule,
        openRuleModal, deleteRule, saveRule, getActiveMeasurements,
        
        downloadTemplate, createGoogleSheetTemplate, loadFromGoogleSheets, handleCSVUpload, executeBulkAction, clearDataHub,
        addAdminEmailField, removeAdminEmailField, saveGeneralSettings, saveEmailConfig, saveAiConfig,
        addNewRole, deleteRole, saveRoles, addUser, deleteUser, openEditUser, updateUserRole, saveUsers
    };
}
</script>
